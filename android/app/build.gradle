apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def configuredValue = { String name ->
    providers.gradleProperty(name)
        .orElse(providers.environmentVariable(name))
        .getOrElse('')
        .trim()
}
def quoted = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
def admobAppId = configuredValue('TDR_ADMOB_APP_ID')
def rewardedAdUnitId = configuredValue('TDR_ADMOB_REWARDED_UNIT_ID')
def revenueCatPublicKey = configuredValue('TDR_REVENUECAT_PUBLIC_SDK_KEY')
def admobTestDeviceIds = configuredValue('TDR_ADMOB_TEST_DEVICE_IDS')
def productionConfigured = admobAppId.startsWith('ca-app-pub-') &&
        rewardedAdUnitId.startsWith('ca-app-pub-') &&
        revenueCatPublicKey.length() > 8
def requestedTasks = gradle.startParameter.taskNames.join(' ').toLowerCase()
def productionRequested = requestedTasks.contains('production') ||
        (requestedTasks.contains('release') && !requestedTasks.contains('bridgetest'))

if (productionRequested && !productionConfigured) {
    throw new GradleException('Production Android build requires TDR_ADMOB_APP_ID, TDR_ADMOB_REWARDED_UNIT_ID and TDR_REVENUECAT_PUBLIC_SDK_KEY.')
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.craftracestudio.topdownrace"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.craftracestudio.topdownrace"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.1.176"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    testBuildType System.getenv('TDR_ANDROID_TEST_BUILD_TYPE') ?: 'debug'
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    flavorDimensions += 'environment'
    productFlavors {
        production {
            dimension 'environment'
            manifestPlaceholders = [ADMOB_APP_ID: admobAppId ?: 'missing-production-admob-app-id']
            buildConfigField 'String', 'TDR_REWARDED_AD_UNIT_ID', quoted(rewardedAdUnitId)
            buildConfigField 'String', 'TDR_REVENUECAT_PUBLIC_SDK_KEY', quoted(revenueCatPublicKey)
            buildConfigField 'boolean', 'TDR_REWARDED_CONFIGURED', String.valueOf(productionConfigured)
            buildConfigField 'String', 'TDR_ADMOB_TEST_DEVICE_IDS', quoted('')
        }
        bridgeTest {
            dimension 'environment'
            applicationIdSuffix '.bridgetest'
            versionNameSuffix '-bridge-test'
            manifestPlaceholders = [ADMOB_APP_ID: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'TDR_REWARDED_AD_UNIT_ID', quoted('ca-app-pub-3940256099942544/5224354917')
            buildConfigField 'String', 'TDR_REVENUECAT_PUBLIC_SDK_KEY', quoted('')
            buildConfigField 'boolean', 'TDR_REWARDED_CONFIGURED', 'false'
            buildConfigField 'String', 'TDR_ADMOB_TEST_DEVICE_IDS', quoted('')
        }
        deviceTest {
            dimension 'environment'
            applicationIdSuffix '.rewardedtest'
            versionNameSuffix '-rewarded-test'
            manifestPlaceholders = [ADMOB_APP_ID: admobAppId ?: 'missing-production-admob-app-id']
            buildConfigField 'String', 'TDR_REWARDED_AD_UNIT_ID', quoted(rewardedAdUnitId)
            buildConfigField 'String', 'TDR_REVENUECAT_PUBLIC_SDK_KEY', quoted(revenueCatPublicKey)
            buildConfigField 'boolean', 'TDR_REWARDED_CONFIGURED', String.valueOf(productionConfigured)
            buildConfigField 'String', 'TDR_ADMOB_TEST_DEVICE_IDS', quoted(admobTestDeviceIds)
        }
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else if (System.getenv('TDR_CI_BRIDGE_TEST') == '1') {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // purchases-admob intentionally declares these as implementation-only; the app
    // references both public APIs directly, so keep the matching versions explicit.
    implementation 'com.revenuecat.purchases:purchases:10.19.0'
    implementation 'com.revenuecat.purchases:purchases-admob:10.19.0'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation 'androidx.test:core:1.7.0'
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
