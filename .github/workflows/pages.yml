name: Deploy Top Down Race
# Single source of DEV deployment is main. Public Google Play 1.1.188 is independent.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolate fresh web deployments from an older cancelled Android bridge job
  # retaining the legacy github-pages concurrency lock.
  # PWA-only changes skip Android and have an independent serialization lock.
  group: ${{ contains(github.event.head_commit.message, '[pwa-only]') && 'tdr-main-pages-pwa' || 'tdr-main-pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Checkout exact integrated DEV main HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: dev-src
          fetch-depth: 1
      - name: Verify recovered race baseline and focused fixes
        working-directory: dev-src
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          node scripts/detect-cuper-assets.mjs
          node scripts/install-karting-tenerife-source.mjs
          node scripts/install-santa-cruz-source.mjs
          node scripts/install-karting-americas-source.mjs
          node scripts/install-karting-canarias-source.mjs
          node scripts/install-karting-canarias-narrow70.mjs
          node scripts/install-karting-canarias-4096-source.mjs
          node scripts/install-circuito-atlantico-source.mjs
          node scripts/circuito-atlantico-official-smoke.mjs
          node scripts/santa-cruz-official-source-smoke.mjs
          node scripts/santa-cruz-clean-lap-photo-smoke.mjs
          node scripts/karting-official-source-smoke.mjs
          node scripts/karting-native-photo-visual-smoke.mjs
          node scripts/karting-canarias-photo-staging-smoke.mjs
          node scripts/karting-canarias-owner-project-smoke.mjs
          node scripts/karting-canarias-camera-zoom-smoke.mjs
          node scripts/karting-canarias-owner-environment-smoke.mjs
          node scripts/karting-canarias-world-scale-smoke.mjs
          node scripts/karting-canarias-narrow70-smoke.mjs
          node scripts/ios-photo-thermal-budget-smoke.mjs
          node scripts/karting-final-environment-smoke.mjs
          node scripts/environment-studio-native-photo-smoke.mjs
          node scripts/environment-finish-line-asset-smoke.mjs
          node scripts/environment-collision-pen-smoke.mjs
          node scripts/environment-freehand-zone-smoke.mjs
          node scripts/owner-environment-import-smoke.mjs
          node scripts/owner-five-environments-smoke.mjs
          node scripts/environment-collision-workflow-smoke.mjs
          node scripts/environment-completed-pen-recovery-smoke.mjs
          node scripts/environment-finished-pen-export-smoke.mjs
          node scripts/environment-safe-exit-smoke.mjs
          node scripts/session-report-navigation-smoke.mjs
          node scripts/session-pb-publish-offer-smoke.mjs
          node scripts/session-record-publish-smoke.mjs
          node scripts/race-control-identity-recovery-smoke.mjs
          node scripts/control-stick-default-smoke.mjs
          node scripts/lobby-online-records-shortcut-smoke.mjs
          node scripts/stats-unlocked-circuits-smoke.mjs
          node scripts/lobby-bottom-directions-smoke.mjs
          node scripts/lobby-overview-platform-wings-smoke.mjs
          node scripts/lobby-car-header-settings-skin-smoke.mjs
          node scripts/centered-selection-rail-smoke.mjs
          node scripts/garage-track-paddock-skin-smoke.mjs
          node scripts/inventory-premium-ui-smoke.mjs
          node scripts/mastery-premium-visual-smoke.mjs
          node scripts/mastery-roof-calibration-smoke.mjs
          node scripts/mastery-roof-hold-repeat-smoke.mjs
          node scripts/environment-karting-americas-import-smoke.mjs
          node scripts/karting-americas-source-inspect.mjs
          node scripts/karting-americas-official-smoke.mjs
          node scripts/karting-americas-clean-lap-photo-smoke.mjs
          node scripts/all-circuit-starts-smoke.mjs
          node scripts/all-circuit-gate-width-smoke.mjs
          node scripts/arafo-photo-native-smoke.mjs
          node scripts/rally-open-stage-visual-smoke.mjs
          node scripts/arafo-rally-drive-pace-smoke.mjs
          node scripts/environment-stage-runtime-diagnostic-smoke.mjs
          node scripts/environment-stage-canvas-smoke.mjs
          node scripts/cuper-season-smoke.mjs
          node scripts/clean-lap-missions-smoke.mjs
          node scripts/cuper-driving-physics-smoke.mjs
          node scripts/cuper-skins-smoke.mjs
          node scripts/cuper-workshop-skin-smoke.mjs
          node scripts/cuper-cards-and-views-smoke.mjs
          node scripts/vehicle-lights-calibration-smoke.mjs
          node scripts/lobby-race-departure-smoke.mjs
          node scripts/lobby-garage-lift-smoke.mjs
          node scripts/odometer-android-next-update-smoke.mjs
          node scripts/race-car-look-smoke.mjs
          node scripts/runtime-resizeobserver-recovery-smoke.mjs
          node scripts/admin-car-editor-route-smoke.mjs
          test -f src/game/scenes/RaceEmbeddedReplaySceneV2.js
          test -f src/game/scenes/MenuGameModesScene.js
          test -f src/game/scenes/RaceGamepadScene.js
          test ! -f src/mainStableBootstrap.js
          test ! -f src/ui/gamepadSettingsEnhancer.js
          grep -q "RaceEmbeddedReplaySceneV2.js" src/game/game.js
          grep -Fq "const active=gamepadSelected();" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "Never hide #tdr-race-controls" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "_tdrHideResidualPhaserSteering" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "_vortexFeelTelemetry" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "TRIGGER_DEADZONE = 0.025" src/game/scenes/RaceUiStabilityScene.js
          grep -q "originalAccel \* gas" src/game/scenes/RaceUiStabilityScene.js
          grep -q "this.touchUI?.setVisible?.(false)" src/game/scenes/RaceUiStabilityScene.js
          grep -q "_hideResidualGamepadSteeringVisual" src/game/scenes/RaceUiStabilityScene.js
          if grep -q "document.body.querySelectorAll('\*')" src/game/scenes/RaceUiStabilityScene.js; then echo "Broad DOM hiding must not return"; exit 1; fi
          test -f public/assets/ui/gamepad/gamepad-controls.webp
          grep -Fq "_showGamepadGuide" src/game/scenes/SettingsWheelModeScene.js
          grep -Fq "if(!row) return;" src/game/scenes/SettingsWheelModeScene.js
          grep -Fq "assets/ui/gamepad/gamepad-controls.webp" src/game/scenes/SettingsWheelModeScene.js
          if grep -Fq "CONTROLES · MANDO" src/game/ui/racePauseUi.js; then exit 1; fi
          grep -Fq "document.body.classList.toggle(GAMEPAD_UI_CLASS,active)" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          if grep -Fq 'body.${GAMEPAD_UI_CLASS} #tdr-handbrake' src/game/scenes/RaceEmbeddedReplaySceneV2.js; then echo "Handbrake visibility must be owned by RaceHandbrakeScene"; exit 1; fi
          if grep -Fq "root?.querySelectorAll?.('*')" src/game/scenes/RaceEmbeddedReplaySceneV2.js; then echo "Touch restore patch must not return"; exit 1; fi
          grep -Fq "const active=gamepadSelected();" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "gamepadVisualsOff" src/game/scenes/RaceScene.js
          grep -q "controls.scheme === 'gamepad'" src/game/scenes/RaceScene.js
          grep -q "_tdrDestroyTouchSteeringUi" src/game/scenes/RaceGamepadScene.js
          grep -q "ui.destroy?.(true)" src/game/scenes/RaceGamepadScene.js
          grep -q "this._tdrHandbrake=handbrake" src/game/scenes/RaceGamepadScene.js
          grep -q "requestAnimationFrame(pollOptions)" src/game/scenes/RaceGamepadScene.js
          node scripts/spark-engine-audio-smoke.mjs
          node scripts/ignition-audio-smoke.mjs
          node scripts/rewarded-audio-focus-smoke.mjs
          node scripts/cloud-portability-smoke.mjs
          node scripts/battery-frame-budget-smoke.mjs
          node scripts/spark-longitudinal-smoke.mjs
          node scripts/rewarded-access-smoke.mjs
          node scripts/shipaton-retirement-smoke.mjs
          node scripts/coin-reward-flight-smoke.mjs
          node scripts/recycler-premium-ui-smoke.mjs
          node scripts/lobby-reward-ready-glow-smoke.mjs
          node scripts/android-rewarded-bridge-smoke.mjs
          node scripts/fresh-gesture-smoke.mjs
          node scripts/bootstrap-regression-smoke.mjs
          node scripts/track-beauty-identity-smoke.mjs
          node scripts/trackstudio-image-mode-smoke.mjs
          node scripts/trackstudio-ios-image-storage-smoke.mjs
          node scripts/trackstudio-image-contract-smoke.mjs
          node scripts/trackstudio-image-native-loader-smoke.mjs
          node scripts/trackstudio-source-menu-smoke.mjs
          node scripts/trackstudio-karting-preview-smoke.mjs
          node scripts/trackstudio-factory-car-scale-smoke.mjs
          node scripts/trackstudio-image-native-rollback-smoke.mjs
          node scripts/karting-image-native-no-legacy-decor-smoke.mjs
          node scripts/trackstudio-image-native-clean-visuals-smoke.mjs
          node scripts/trackstudio-exit-guard-smoke.mjs
          node scripts/trackstudio-shape-smoke.mjs
          node scripts/trackstudio-shape-touch-smoke.mjs
          node scripts/trackstudio-touch-targets-v2-smoke.mjs
          node scripts/trackstudio-pen-tool-smoke.mjs
          node scripts/trackstudio-image-width-smoke.mjs
          node scripts/trackstudio-text-crash-smoke.mjs
          node scripts/trackstudio-start-grid-toggle-smoke.mjs
          node scripts/trackstudio-start-finish-access-smoke.mjs
          grep -q "start_red.webp" src/game/scenes/RaceCleanStartLightsScene.js
          grep -q "Surface physics only" src/game/scenes/RaceSurfaceProfileScene.js
          if grep -q "setTexture?.('off')" src/game/scenes/RaceSurfaceProfileScene.js; then exit 1; fi
          grep -q "this.scene.start('race'" src/game/scenes/MenuGameModesScene.js
          grep -q "src/main.js" index.html
      - name: Audit hardcoded interface text
        working-directory: dev-src
        run: node scripts/audit-i18n-hardcoded.mjs
      - name: Verify production candidate boundary
        working-directory: dev-src
        shell: bash
        env:
          VITE_TDR_ONLINE_URL: ${{ vars.VITE_TDR_ONLINE_URL }}
          VITE_TDR_ONLINE_PUBLIC: ${{ vars.VITE_TDR_ONLINE_PUBLIC }}
          BASE: ./
        run: |
          test -n "${VITE_TDR_ONLINE_URL}"
          test -n "${VITE_TDR_ONLINE_PUBLIC}"
          npm ci --no-audit --no-fund
          npm run build:prod
          node scripts/karting-canarias-4096-smoke.mjs
          node scripts/karting-canarias-clean-lap-photo-smoke.mjs
          grep -Rqs "juukbnkjboiazqggqcyv.supabase.co" dist || { echo "Production bundle lost Supabase URL"; exit 1; }
          grep -Rqs "sb_publishable_" dist || { echo "Production bundle lost Supabase publishable key"; exit 1; }
      - name: Inventariar escalas de circuitos y coches (POST-INSTALL, solo lectura)
        working-directory: dev-src
        shell: bash
        run: |
          node scripts/audit-track-car-scale-smoke.mjs
          node scripts/audit-track-car-scale.mjs --out-dir "$RUNNER_TEMP/tdr-scale-inventory" --summary "$GITHUB_STEP_SUMMARY"
      - name: Adjuntar inventario de escala reproducible
        uses: actions/upload-artifact@v4
        with:
          name: TDR-track-car-scale-audit
          path: ${{ runner.temp }}/tdr-scale-inventory/
          if-no-files-found: error
          retention-days: 30
      - name: Medir siluetas alfa y contrastar los tres kartings (solo lectura)
        working-directory: dev-src
        shell: bash
        run: |
          node scripts/audit-car-alpha-kartings-smoke.mjs
          node scripts/audit-car-alpha-kartings.mjs --out-dir "$RUNNER_TEMP/tdr-car-alpha-kartings" --summary "$GITHUB_STEP_SUMMARY"
      - name: Adjuntar informe de carrocerías y tres kartings
        uses: actions/upload-artifact@v4
        with:
          name: TDR-car-alpha-kartings-audit
          path: ${{ runner.temp }}/tdr-car-alpha-kartings/
          if-no-files-found: error
          retention-days: 30
      - name: Build development
        working-directory: dev-src
        shell: bash
        env:
          VITE_TDR_ONLINE_URL: ${{ vars.VITE_TDR_ONLINE_URL }}
          VITE_TDR_ONLINE_PUBLIC: ${{ vars.VITE_TDR_ONLINE_PUBLIC }}
        run: |
          test -n "${VITE_TDR_ONLINE_URL}"
          test -n "${VITE_TDR_ONLINE_PUBLIC}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          npm ci --no-audit --no-fund
          npx vite build --base=/TopdownCraftrace/dev/
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/
      - name: Assemble main-only Pages (public entry + DEV)
        shell: bash
        run: |
          mkdir -p site/dev site/dev-live
          printf 'DEV_SOURCE_SHA=%s\n' "$(git -C dev-src rev-parse HEAD)" > dev-src/dist/dev-build.txt
          cp -R dev-src/dist/. site/dev/
          cp -R dev-src/dist/. site/dev-live/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top Down RACE</title>
          <style>body{min-height:100vh;display:grid;place-items:center;margin:0;background:#09101d;color:#fff;font:16px system-ui}main{max-width:600px;padding:32px;text-align:center}a{display:inline-block;margin:8px;padding:14px 20px;background:#19477a;color:white;border-radius:10px;text-decoration:none}small{color:#b2c5d9}</style></head>
          <body><main><h1>TOP DOWN RACE</h1><p>La versión pública 1.1.188 está disponible en Google Play.</p>
          <a href="https://play.google.com/store/apps/details?id=com.craftracestudio.topdownrace">Abrir Google Play</a>
          <a href="./dev/">Versión DEV (pruebas)</a><p><small>Google Play se actualiza por separado. Desarrollo desde main.</small></p>
          </main></body></html>
          HTML
      - name: Verify DEV artifact
        shell: bash
        run: |
          cmp dev-src/dist/index.html site/dev/index.html
          cmp dev-src/dist/index.html site/dev-live/index.html
          test -f site/dev/sw.js
          test -f site/dev/assets/tracks/karting-tenerife/karting-tenerife-official.webp
          test -f site/dev/assets/tracks/karting-americas/karting-americas-official.webp
          test -f site/dev/assets/tracks/karting-americas/photo-0-0.webp
          test -f site/dev/assets/tracks/karting-americas/photo-2-1.webp
          test -f site/dev/assets/tracks/karting-tenerife/beauty/karting-tenerife-trackstudio-0.webp
          test -f site/dev/assets/tracks/karting-tenerife/beauty/karting-tenerife-trackstudio-3.webp
          test -f site/dev-live/sw.js
          grep -Fq "DEV_SOURCE_SHA=$(git -C dev-src rev-parse HEAD)" site/dev/dev-build.txt
          grep -Fq "DEV_SOURCE_SHA=$(git -C dev-src rev-parse HEAD)" site/dev-live/dev-build.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  android_release_bridge:
    # Browser/PWA-only commits do not generate Android binaries.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[pwa-only]') }}
    name: Android release WebView bridge
    runs-on: ubuntu-latest
    env:
      TDR_ANDROID_TEST_BUILD_TYPE: release
      TDR_CI_BRIDGE_TEST: '1'
      BASE: ./
    steps:
      - name: Checkout exact development HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK packages
        shell: bash
        run: |
          test -n "${ANDROID_HOME}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build production web payload and sync Capacitor
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          # Karting Tenerife image-native assets are generated from the
          # authored source and ignored by Git; the Android runner must stage
          # them just like the main Pages build and standalone QA workflow.
          node scripts/install-karting-tenerife-source.mjs
          node scripts/karting-official-source-smoke.mjs
          npm run build:android
      - name: Compile minified release and run native unit tests
        working-directory: android
        run: ./gradlew :app:testBridgeTestReleaseUnitTest :app:assembleBridgeTestRelease --stacktrace
      - name: Attach installable Android DEV test APK
        uses: actions/upload-artifact@v4
        with:
          name: TDR-DEV-1.2.220-Android-bridge-test
          path: android/app/build/outputs/apk/bridgeTest/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare accelerated Android emulator
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "${ANDROID_HOME}/platform-tools/adb" kill-server || true
          "${ANDROID_HOME}/platform-tools/adb" start-server
      - name: Exercise bridge inside release WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          script: cd android && ./gradlew :app:connectedBridgeTestReleaseAndroidTest --stacktrace

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

