name: Deploy Top Down Race

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public beta
        uses: actions/checkout@v4
        with:
          ref: beta-1.0
          path: beta
          fetch-depth: 1
      - name: Read beta revision
        id: beta-rev
        working-directory: beta
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore frozen beta build
        id: beta-cache
        uses: actions/cache@v4
        with:
          path: beta/dist
          key: tdr-public-beta-${{ steps.beta-rev.outputs.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: dev-src
          fetch-depth: 1
      - name: Verify race wrappers
        working-directory: dev-src
        shell: bash
        run: |
          test -f src/game/scenes/RaceNoDiagScene.js
          test -f src/game/scenes/RaceStaticMinimapScene.js
          test -f src/game/scenes/RaceStaticGhostStatusScene.js
          test -f src/game/scenes/RaceTop10ReplayScene.js
          test -f src/game/scenes/RaceReplayCleanScene.js
          test -f src/game/scenes/RaceEmbeddedReplayScene.js
          test -f src/game/scenes/RaceEmbeddedReplaySceneV2.js
          test -f src/game/scenes/RaceDuelOpponentRepairScene.js
          test -f src/game/audio/CarEngineSampleRuntime.js
          test -f src/game/audio/EngineCombustionProcessor.js
          test -f src/game/stats/localRaceRecords.js
          test -f src/game/scenes/StatsBroadcastScene.js
          test -f src/game/scenes/StatsBroadcastCompactScene.js
          test -f src/game/scenes/StatsBroadcastReplayScene.js
          test -f src/game/scenes/StatsBroadcastRealReplayScene.js
          test -f src/game/scenes/StatsTesterExchangeScene.js
          test -f src/game/scenes/statsTesterExchangePatch.js
          test -f src/game/scenes/MenuRewardedAdsScene.js
          test -f src/game/social/pilotProfile.js
          test -f src/game/social/sharedLapExchange.js
          test -f src/game/social/sharedLapStore.js
          test -f src/ui/settingsLegalEnhancer.js
          test -f src/game/ui/raceLoadingExperienceV7.js
          test -f src/game/ui/raceLoadingExperienceV8.js
          test -f src/game/ui/raceLoadingExperienceV9.js
          test -f src/game/ui/raceLoadingExperienceV10.js
          test -f src/game/ui/raceLoadingExperienceV11.js
          test -f src/game/ui/racePauseUi.css
          test -f src/game/ui/racePauseUi.js
          test -f src/game/ui/lobby-tablet.css
          grep -q "settingsLegalEnhancer.js" index.html
          grep -q "tdr-legal-modal" src/ui/settingsLegalEnhancer.js
          grep -q "PRIVACIDAD DE ANUNCIOS" src/ui/settingsLegalEnhancer.js
          grep -q "raceLoadingExperienceV11.js" src/game/ui/raceLoadingExperience.js
          grep -q -- "--tdr-vv-height" src/game/ui/raceLoadingExperienceV7.js
          grep -q "max-height:520px" src/game/ui/raceLoadingExperienceV7.js
          grep -q "function isAndroid" src/game/ui/raceLoadingExperienceV7.js
          grep -q "window.visualViewport" src/game/ui/raceLoadingExperienceV7.js
          grep -q "!isAndroid()" src/game/ui/raceLoadingExperienceV7.js
          grep -q "tdr-race-loading-experience-v8-car-center" src/game/ui/raceLoadingExperienceV8.js
          grep -q "position:absolute!important" src/game/ui/raceLoadingExperienceV8.js
          grep -q "grid-column:2!important" src/game/ui/raceLoadingExperienceV8.js
          grep -q "tdr-race-loading-experience-v9-visual-car-center" src/game/ui/raceLoadingExperienceV9.js
          grep -q "top:-28px!important" src/game/ui/raceLoadingExperienceV9.js
          grep -q "tdr-race-loading-experience-v10-car-label-inset" src/game/ui/raceLoadingExperienceV10.js
          grep -q "right:12px!important" src/game/ui/raceLoadingExperienceV10.js
          grep -q "max-width:calc(100% - 36px)!important" src/game/ui/raceLoadingExperienceV10.js
          grep -q "tdr-race-loading-experience-v11-car-label-gap" src/game/ui/raceLoadingExperienceV11.js
          grep -q "left:72%!important" src/game/ui/raceLoadingExperienceV11.js
          grep -q "background:rgba(3,7,12,.82)" src/game/ui/racePauseUi.css
          if grep -q "backdrop-filter" src/game/ui/racePauseUi.css; then echo "Pause overlay must not use full-screen backdrop blur"; exit 1; fi
          grep -q "pointerup" src/game/ui/racePauseUi.js
          grep -q "lastPointerAt" src/game/ui/racePauseUi.js
          grep -q "RaceEmbeddedReplaySceneV2.js" src/game/game.js
          grep -q "CarEngineSampleRuntime" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "AudioContext" src/game/audio/CarEngineSampleRuntime.js
          grep -q "audioWorklet" src/game/audio/CarEngineSampleRuntime.js
          grep -q "AudioWorkletNode" src/game/audio/CarEngineSampleRuntime.js
          grep -q "EngineCombustionProcessor.js" src/game/audio/CarEngineSampleRuntime.js
          grep -q "UPDATE_MS=45" src/game/audio/CarEngineSampleRuntime.js
          grep -q "IDLE_RPM=950" src/game/audio/CarEngineSampleRuntime.js
          grep -q "REDLINE_RPM=7200" src/game/audio/CarEngineSampleRuntime.js
          grep -Fq "if(throttle>.05)return REDLINE_RPM" src/game/audio/CarEngineSampleRuntime.js
          grep -Fq "this._rpm<3300?5900:this._rpm<5600?1250:900" src/game/audio/CarEngineSampleRuntime.js
          if grep -q "_shiftUntil" src/game/audio/CarEngineSampleRuntime.js; then echo "Single-sweep engine must not contain acoustic shift state"; exit 1; fi
          grep -q "_targetRpm" src/game/audio/CarEngineSampleRuntime.js
          grep -q "registerProcessor('tdr-engine-combustion'" src/game/audio/EngineCombustionProcessor.js
          grep -q "firePhases=\[0,180,360,540\]" src/game/audio/EngineCombustionProcessor.js
          grep -q "cylinderStrength" src/game/audio/EngineCombustionProcessor.js
          grep -q "class Resonator" src/game/audio/EngineCombustionProcessor.js
          grep -q "Number.isFinite(y)" src/game/audio/EngineCombustionProcessor.js
          grep -Fq "y=clamp(y,-12,12)" src/game/audio/EngineCombustionProcessor.js
          grep -q "StatsTesterExchangeScene.js" src/game/game.js
          grep -q "MenuRewardedAdsScene.js" src/game/game.js
          grep -q "store_rewarded_coins" src/game/scenes/MenuRewardedAdsScene.js
          grep -q "recycler_exchange" src/game/monetization/RewardedAdsProvider.js
          grep -q "TDRLAP1:" src/game/social/sharedLapExchange.js
          grep -q "PERFIL DE PILOTO" src/game/social/pilotProfile.js
          grep -q "TESTERS" src/game/scenes/StatsTesterExchangeScene.js
          grep -q "statsTesterExchangePatch.js" src/game/tracks/trackPublicNames.js
          grep -q "this._diag = () => {}" src/game/scenes/RaceNoDiagScene.js
          grep -q "tdr-static-minimap" src/game/scenes/RaceStaticMinimapScene.js
          grep -q "tdr-static-ghost-status" src/game/scenes/RaceStaticGhostStatusScene.js
          grep -q "tdr2:topReplay:" src/game/scenes/RaceTop10ReplayScene.js
          grep -q "tdr2:statsNativeReplay" src/game/scenes/RaceTop10ReplayScene.js
          grep -q "RACE CONTROL // REPLAY REAL" src/game/scenes/RaceTop10ReplayScene.js
          grep -q "REPLAY_SPEEDS" src/game/scenes/RaceTop10ReplayScene.js
          grep -q "data-seek" src/game/scenes/RaceTop10ReplayScene.js
          grep -q "_stepStatsReplaySample" src/game/scenes/RaceTop10ReplayScene.js
          grep -q "tdr-native-replay-clean" src/game/scenes/RaceReplayCleanScene.js
          grep -q "_tdrPauseClockGuard" src/game/scenes/RaceReplayCleanScene.js
          grep -q "this.time.paused=true" src/game/scenes/RaceReplayCleanScene.js
          grep -q "pauseAll" src/game/scenes/RaceReplayCleanScene.js
          grep -q "resumeAll" src/game/scenes/RaceReplayCleanScene.js
          grep -q "depth>=900" src/game/scenes/RaceReplayCleanScene.js
          grep -q "interactive" src/game/scenes/RaceReplayCleanScene.js
          grep -q "#tdr-race-controls" src/game/scenes/RaceReplayCleanScene.js
          grep -q "#tdr-handbrake" src/game/scenes/RaceReplayCleanScene.js
          grep -q "#tdr-steering-wheel" src/game/scenes/RaceReplayCleanScene.js
          grep -q "data-tdr-embedded-feed" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "_copyEmbeddedReplayFrame" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "drawImage" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "postrender" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "_stopEmbeddedFeedLoop" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "_drawReplayAnalysis" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "ANÁLISIS TRAZADA" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "TRAZADA ✓" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "RITMO" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "pxpsToKmh" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "sampleSpeedAtTime" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "samplePositionAt" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "targetAspect" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "_tdrEmbeddedViewport" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "centerOn" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "embeddedRequested" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "replayTrackKey" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -Fq "this._tdrEmbeddedReplay=embeddedRequested===true" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "RaceDuelOpponentRepairScene.js" src/game/scenes/RaceSurvivalHardLapCapScene.js
          grep -q "findNestedVisual" src/game/scenes/RaceDuelOpponentRepairScene.js
          grep -q "_tdrDuelOpponentInitAttempts" src/game/scenes/RaceDuelOpponentRepairScene.js
          grep -q "matchingLap" src/game/stats/localRaceRecords.js
          grep -q "br-brand-watermark" src/game/scenes/StatsBroadcastScene.js
          grep -q "logo_.*_negativo" src/game/scenes/StatsBroadcastScene.js
          grep -q "br-record-car" src/game/scenes/StatsBroadcastScene.js
          grep -q "br-native-active" src/game/scenes/StatsBroadcastRealReplayScene.js
          grep -q "grid-auto-rows:max-content" src/game/scenes/StatsBroadcastRealReplayScene.js
          grep -q "cloneNode" src/game/scenes/StatsBroadcastRealReplayScene.js
          grep -q "br-chart" src/game/scenes/StatsBroadcastRealReplayScene.js
          grep -q "embedded:true" src/game/scenes/StatsBroadcastRealReplayScene.js
          grep -q "scene.launch('race'" src/game/scenes/StatsBroadcastRealReplayScene.js
          grep -q "_refreshWorkshopInventoryFromStore" src/game/scenes/UpgradeWorkshopCarUnlockScene.js
          grep -q "__recyclerCloseRefresh" src/game/scenes/UpgradeWorkshopCarUnlockScene.js
          grep -q "this.state=loadGarage()" src/game/scenes/UpgradeWorkshopCarUnlockScene.js
          grep -q "lobby-tablet.css" src/game/scenes/MenuDomUiScene.js
          grep -q "tabletLandscape" src/game/scenes/MenuDomUiScene.js
      - name: Build development
        working-directory: dev-src
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          npm ci --no-audit --no-fund
          npx vite build --base=/TopdownCraftrace/dev/
          sed -i -E 's/DEV 1\.0\.[0-9]+/DEV 1.0.126/g' dist/index.html
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/
      - name: Assemble public beta plus DEV
        shell: bash
        run: |
          rm -rf beta/dist/dev beta/dist/dev-live
          mkdir -p beta/dist/dev beta/dist/dev-live
          cp -R dev-src/dist/. beta/dist/dev/
          cp -R dev-src/dist/. beta/dist/dev-live/
      - name: Verify DEV artifact
        shell: bash
        run: |
          cmp dev-src/dist/index.html beta/dist/dev/index.html
          cmp dev-src/dist/index.html beta/dist/dev-live/index.html
          test -f beta/dist/dev/sw.js
          test -f beta/dist/dev-live/sw.js
          grep -q 'DEV 1\.0\.126' beta/dist/dev/index.html
          grep -q 'DEV 1\.0\.126' beta/dist/dev-live/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: beta/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
