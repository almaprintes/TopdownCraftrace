# Shipping deploy: BETA 0.0.3 + DEV 0.0.4d + isolated Veloce audio lab
name: Deploy GitHub Pages

on:
  push:
    branches: [main, dev-0.0.4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BETA 0.0.3
        uses: actions/checkout@v4
        with:
          ref: beta-0.0.3
          path: stable

      - name: Checkout DEV 0.0.4d
        uses: actions/checkout@v4
        with:
          ref: dev-0.0.4
          path: develop-src

      - name: Checkout isolated Veloce audio lab
        uses: actions/checkout@v4
        with:
          ref: lab/veloce-audio
          path: lab-src

      - name: Checkout audio assets
        uses: actions/checkout@v4
        with:
          ref: fix/car-audio-v1
          path: audio-src

      - name: Checkout main assets
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout pre-Production Studio recovery
        uses: actions/checkout@v4
        with:
          ref: recovery/pre-production-studio-2026-09-01
          path: recovery-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install BETA 0.0.3 dependencies
        working-directory: stable
        run: npm ci --no-audit --no-fund

      - name: Build BETA 0.0.3
        working-directory: stable
        run: npx vite build --base=/TopdownCraftrace/

      - name: Copy BETA tutorial assets
        working-directory: stable
        run: |
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/

      - name: Install DEV 0.0.4d dependencies
        working-directory: develop-src
        run: npm ci --no-audit --no-fund

      - name: Build DEV 0.0.4d
        working-directory: develop-src
        run: npx vite build --base=/TopdownCraftrace/dev/

      - name: Copy DEV tutorial assets
        working-directory: develop-src
        run: |
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/

      - name: Copy Veloce car audio into DEV 0.0.4d
        run: |
          mkdir -p develop-src/dist/assets/audio/cars
          cp -R audio-src/public/assets/audio/cars/. develop-src/dist/assets/audio/cars/
          mkdir -p develop-src/dist/assets/audio/cars/veloce_flash/engine
          cp main-src/public/assets/audio/cars/veloce_flash/engine/freesound_community-import-car-revs-on-chassis-dyno-with-turbo-66272.mp3 develop-src/dist/assets/audio/cars/veloce_flash/engine/

      - name: Stamp visible DEV 0.0.4d badge
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('develop-src/dist/index.html')
          html = p.read_text(encoding='utf-8')
          badge = '''<div id="tdr-dev-build-badge" style="position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:2147483647;padding:5px 8px;border-radius:7px;background:rgba(0,0,0,.72);color:#fff;font:700 11px/1.2 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;letter-spacing:.35px;pointer-events:none">DEV 0.0.4d</div>'''
          html = html.replace('</body>', badge + '</body>')
          p.write_text(html, encoding='utf-8')
          PY

      - name: Install audio-test dependencies
        working-directory: audio-src
        run: npm ci --no-audit --no-fund

      - name: Build audio test
        working-directory: audio-src
        run: npx vite build --base=/TopdownCraftrace/audio-test/

      - name: Copy audio-test tutorial assets
        working-directory: audio-src
        run: |
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/

      - name: Install recovery dependencies
        working-directory: recovery-src
        run: npm ci --no-audit --no-fund

      - name: Build pre-Production Studio recovery
        working-directory: recovery-src
        run: npx vite build --base=/TopdownCraftrace/recovery-pre-production/

      - name: Copy recovery tutorial assets
        working-directory: recovery-src
        run: |
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/

      - name: Add DEV 0.0.4d build under /dev
        run: |
          rm -rf stable/dist/dev
          mkdir -p stable/dist/dev
          cp -R develop-src/dist/. stable/dist/dev/

      - name: Add isolated Veloce audio lab under /audio-lab
        run: |
          rm -rf stable/dist/audio-lab
          mkdir -p stable/dist/audio-lab/assets/audio/cars
          cp lab-src/audio-lab/*.html stable/dist/audio-lab/
          cp -R audio-src/public/assets/audio/cars/. stable/dist/audio-lab/assets/audio/cars/
          cp main-src/public/assets/audio/cars/veloce_flash/engine/freesound_community-import-car-revs-on-chassis-dyno-with-turbo-66272.mp3 stable/dist/audio-lab/assets/audio/cars/veloce_flash/engine/

      - name: Add audio test under /audio-test
        run: |
          rm -rf stable/dist/audio-test
          mkdir -p stable/dist/audio-test
          cp -R audio-src/dist/. stable/dist/audio-test/

      - name: Add recovery build under /recovery-pre-production
        run: |
          rm -rf stable/dist/recovery-pre-production
          mkdir -p stable/dist/recovery-pre-production
          cp -R recovery-src/dist/. stable/dist/recovery-pre-production/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: stable/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
