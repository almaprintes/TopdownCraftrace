name: Deploy Top Down Race
# Single source of DEV deployment is main. Public Google Play 1.1.188 is independent.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Checkout exact integrated DEV main HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: dev-src
          fetch-depth: 1
      - name: Verify recovered race baseline and focused fixes
        working-directory: dev-src
        shell: bash
        run: |
          test -f src/game/scenes/RaceEmbeddedReplaySceneV2.js
          test -f src/game/scenes/MenuGameModesScene.js
          test -f src/game/scenes/RaceGamepadScene.js
          test ! -f src/mainStableBootstrap.js
          test ! -f src/ui/gamepadSettingsEnhancer.js
          grep -q "RaceEmbeddedReplaySceneV2.js" src/game/game.js
          grep -Fq "const active=gamepadSelected();" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "Never hide #tdr-race-controls" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "_tdrHideResidualPhaserSteering" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "_vortexFeelTelemetry" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "TRIGGER_DEADZONE = 0.025" src/game/scenes/RaceUiStabilityScene.js
          grep -q "originalAccel \* gas" src/game/scenes/RaceUiStabilityScene.js
          grep -q "this.touchUI?.setVisible?.(false)" src/game/scenes/RaceUiStabilityScene.js
          grep -q "_hideResidualGamepadSteeringVisual" src/game/scenes/RaceUiStabilityScene.js
          if grep -q "document.body.querySelectorAll('\*')" src/game/scenes/RaceUiStabilityScene.js; then echo "Broad DOM hiding must not return"; exit 1; fi
          test -f public/assets/ui/gamepad/gamepad-controls.webp
          grep -Fq "_showGamepadGuide" src/game/scenes/SettingsWheelModeScene.js
          grep -Fq "if(!row) return;" src/game/scenes/SettingsWheelModeScene.js
          grep -Fq "assets/ui/gamepad/gamepad-controls.webp" src/game/scenes/SettingsWheelModeScene.js
          if grep -Fq "CONTROLES · MANDO" src/game/ui/racePauseUi.js; then exit 1; fi
          grep -Fq "document.body.classList.toggle(GAMEPAD_UI_CLASS,active)" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          if grep -Fq 'body.${GAMEPAD_UI_CLASS} #tdr-handbrake' src/game/scenes/RaceEmbeddedReplaySceneV2.js; then echo "Handbrake visibility must be owned by RaceHandbrakeScene"; exit 1; fi
          if grep -Fq "root?.querySelectorAll?.('*')" src/game/scenes/RaceEmbeddedReplaySceneV2.js; then echo "Touch restore patch must not return"; exit 1; fi
          grep -Fq "const active=gamepadSelected();" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "gamepadVisualsOff" src/game/scenes/RaceScene.js
          grep -q "controls.scheme === 'gamepad'" src/game/scenes/RaceScene.js
          grep -q "_tdrDestroyTouchSteeringUi" src/game/scenes/RaceGamepadScene.js
          grep -q "ui.destroy?.(true)" src/game/scenes/RaceGamepadScene.js
          grep -q "this._tdrHandbrake=handbrake" src/game/scenes/RaceGamepadScene.js
          grep -q "requestAnimationFrame(pollOptions)" src/game/scenes/RaceGamepadScene.js
          node scripts/spark-engine-audio-smoke.mjs
          node scripts/ignition-audio-smoke.mjs
          node scripts/rewarded-audio-focus-smoke.mjs
          node scripts/cloud-portability-smoke.mjs
          node scripts/battery-frame-budget-smoke.mjs
          node scripts/spark-longitudinal-smoke.mjs
          node scripts/rewarded-access-smoke.mjs
          node scripts/coin-reward-flight-smoke.mjs
          node scripts/android-rewarded-bridge-smoke.mjs
          node scripts/fresh-gesture-smoke.mjs
          node scripts/bootstrap-regression-smoke.mjs
          node scripts/track-beauty-identity-smoke.mjs
          node scripts/trackstudio-image-mode-smoke.mjs
          node scripts/trackstudio-exit-guard-smoke.mjs
          node scripts/trackstudio-shape-smoke.mjs
          grep -q "start_red.webp" src/game/scenes/RaceCleanStartLightsScene.js
          grep -q "Surface physics only" src/game/scenes/RaceSurfaceProfileScene.js
          if grep -q "setTexture?.('off')" src/game/scenes/RaceSurfaceProfileScene.js; then exit 1; fi
          grep -q "this.scene.start('race'" src/game/scenes/MenuGameModesScene.js
          grep -q "src/main.js" index.html
      - name: Audit hardcoded interface text
        working-directory: dev-src
        run: node scripts/audit-i18n-hardcoded.mjs
      - name: Verify production candidate boundary
        working-directory: dev-src
        shell: bash
        env:
          VITE_TDR_ONLINE_URL: ${{ vars.VITE_TDR_ONLINE_URL }}
          VITE_TDR_ONLINE_PUBLIC: ${{ vars.VITE_TDR_ONLINE_PUBLIC }}
          BASE: ./
        run: |
          test -n "${VITE_TDR_ONLINE_URL}"
          test -n "${VITE_TDR_ONLINE_PUBLIC}"
          npm ci --no-audit --no-fund
          npm run build:prod
          grep -Rqs "juukbnkjboiazqggqcyv.supabase.co" dist || { echo "Production bundle lost Supabase URL"; exit 1; }
          grep -Rqs "sb_publishable_" dist || { echo "Production bundle lost Supabase publishable key"; exit 1; }
      - name: Build development
        working-directory: dev-src
        shell: bash
        env:
          VITE_TDR_ONLINE_URL: ${{ vars.VITE_TDR_ONLINE_URL }}
          VITE_TDR_ONLINE_PUBLIC: ${{ vars.VITE_TDR_ONLINE_PUBLIC }}
        run: |
          test -n "${VITE_TDR_ONLINE_URL}"
          test -n "${VITE_TDR_ONLINE_PUBLIC}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          npm ci --no-audit --no-fund
          npx vite build --base=/TopdownCraftrace/dev/
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/
      - name: Assemble main-only Pages (public entry + DEV)
        shell: bash
        run: |
          mkdir -p site/dev site/dev-live
          printf 'DEV_SOURCE_SHA=%s\n' "$(git -C dev-src rev-parse HEAD)" > dev-src/dist/dev-build.txt
          cp -R dev-src/dist/. site/dev/
          cp -R dev-src/dist/. site/dev-live/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top Down RACE</title>
          <style>body{min-height:100vh;display:grid;place-items:center;margin:0;background:#09101d;color:#fff;font:16px system-ui}main{max-width:600px;padding:32px;text-align:center}a{display:inline-block;margin:8px;padding:14px 20px;background:#19477a;color:white;border-radius:10px;text-decoration:none}small{color:#b2c5d9}</style></head>
          <body><main><h1>TOP DOWN RACE</h1><p>La versión pública 1.1.188 está disponible en Google Play.</p>
          <a href="https://play.google.com/store/apps/details?id=com.craftracestudio.topdownrace">Abrir Google Play</a>
          <a href="./dev/">Versión DEV (pruebas)</a><p><small>Google Play se actualiza por separado. Desarrollo desde main.</small></p>
          </main></body></html>
          HTML
      - name: Verify DEV artifact
        shell: bash
        run: |
          cmp dev-src/dist/index.html site/dev/index.html
          cmp dev-src/dist/index.html site/dev-live/index.html
          test -f site/dev/sw.js
          test -f site/dev-live/sw.js
          grep -Fq "DEV_SOURCE_SHA=$(git -C dev-src rev-parse HEAD)" site/dev/dev-build.txt
          grep -Fq "DEV_SOURCE_SHA=$(git -C dev-src rev-parse HEAD)" site/dev-live/dev-build.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  android_release_bridge:
    # Browser/PWA-only commits do not generate Android binaries.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[pwa-only]') }}
    name: Android release WebView bridge
    runs-on: ubuntu-latest
    env:
      TDR_ANDROID_TEST_BUILD_TYPE: release
      TDR_CI_BRIDGE_TEST: '1'
      BASE: ./
    steps:
      - name: Checkout exact development HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK packages
        shell: bash
        run: |
          test -n "${ANDROID_HOME}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build production web payload and sync Capacitor
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build:android
      - name: Compile minified release and run native unit tests
        working-directory: android
        run: ./gradlew :app:testBridgeTestReleaseUnitTest :app:assembleBridgeTestRelease --stacktrace
      - name: Prepare accelerated Android emulator
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "${ANDROID_HOME}/platform-tools/adb" kill-server || true
          "${ANDROID_HOME}/platform-tools/adb" start-server
      - name: Exercise bridge inside release WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          script: cd android && ./gradlew :app:connectedBridgeTestReleaseAndroidTest --stacktrace

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

