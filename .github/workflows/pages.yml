name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop-src

      - name: Checkout pre-Production Studio recovery
        uses: actions/checkout@v4
        with:
          ref: recovery/pre-production-studio-2026-09-01
          path: recovery-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install stable dependencies
        working-directory: stable
        run: npm ci --no-audit --no-fund

      - name: Build stable main
        working-directory: stable
        run: npx vite build --base=/TopdownCraftrace/

      - name: Copy stable tutorial assets
        working-directory: stable
        run: |
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/

      - name: Install develop dependencies
        working-directory: develop-src
        run: npm ci --no-audit --no-fund

      - name: Build develop
        working-directory: develop-src
        run: npx vite build --base=/TopdownCraftrace/dev/

      - name: Copy develop tutorial assets
        working-directory: develop-src
        run: |
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/

      - name: Install recovery dependencies
        working-directory: recovery-src
        run: npm ci --no-audit --no-fund

      - name: Build pre-Production Studio recovery
        working-directory: recovery-src
        run: npx vite build --base=/TopdownCraftrace/recovery-pre-production/

      - name: Copy recovery tutorial assets
        working-directory: recovery-src
        run: |
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/

      - name: Add develop build under /dev
        run: |
          rm -rf stable/dist/dev
          mkdir -p stable/dist/dev
          cp -R develop-src/dist/. stable/dist/dev/

      - name: Add recovery build under /recovery-pre-production
        run: |
          rm -rf stable/dist/recovery-pre-production
          mkdir -p stable/dist/recovery-pre-production
          cp -R recovery-src/dist/. stable/dist/recovery-pre-production/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: stable/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
