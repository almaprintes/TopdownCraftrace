name: Deploy Top Down Race

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public beta
        uses: actions/checkout@v4
        with:
          ref: beta-1.0
          path: beta
          fetch-depth: 1
      - name: Read beta revision
        id: beta-rev
        working-directory: beta
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore frozen beta build
        id: beta-cache
        uses: actions/cache@v4
        with:
          path: beta/dist
          key: tdr-public-beta-${{ steps.beta-rev.outputs.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: dev-src
          fetch-depth: 1
      - name: Verify recovered race path
        working-directory: dev-src
        shell: bash
        run: |
          test -f src/game/scenes/RaceEmbeddedReplaySceneV2.js
          test -f src/game/scenes/MenuGameModesScene.js
          test -f src/game/scenes/MenuRewardedAdsScene.js
          test -f src/game/ui/racePauseUi.js
          test -f src/game/ui/lobby-tablet.css
          grep -q "RaceEmbeddedReplaySceneV2.js" src/game/game.js
          grep -q "this.scene.start('race'" src/game/scenes/MenuGameModesScene.js
          grep -q "CarEngineSampleRuntime" src/game/scenes/RaceEmbeddedReplaySceneV2.js
          grep -q "lobby-tablet.css" src/game/scenes/MenuDomUiScene.js
          grep -q "settingsLegalEnhancer.js" index.html
          grep -q "src/main.js" index.html
          if grep -q "mainStableBootstrap.js" index.html; then echo "Recovered DEV must use the proven main.js entrypoint"; exit 1; fi
      - name: Build development
        working-directory: dev-src
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          npm ci --no-audit --no-fund
          npx vite build --base=/TopdownCraftrace/dev/
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/
      - name: Assemble public beta plus DEV
        shell: bash
        run: |
          rm -rf beta/dist/dev beta/dist/dev-live
          mkdir -p beta/dist/dev beta/dist/dev-live
          cp -R dev-src/dist/. beta/dist/dev/
          cp -R dev-src/dist/. beta/dist/dev-live/
      - name: Verify DEV artifact
        shell: bash
        run: |
          cmp dev-src/dist/index.html beta/dist/dev/index.html
          cmp dev-src/dist/index.html beta/dist/dev-live/index.html
          test -f beta/dist/dev/sw.js
          test -f beta/dist/dev-live/sw.js
          grep -q 'DEV 1\.0\.171' beta/dist/dev/index.html
          grep -q 'DEV 1\.0\.171' beta/dist/dev-live/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: beta/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
