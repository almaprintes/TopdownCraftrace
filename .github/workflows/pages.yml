name: Deploy Top Down Race

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public beta
        uses: actions/checkout@v4
        with:
          ref: beta-0.0.3
          path: beta

      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: main
          path: dev-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install beta dependencies
        working-directory: beta
        run: npm ci --no-audit --no-fund

      - name: Build beta
        working-directory: beta
        run: npx vite build --base=/TopdownCraftrace/

      - name: Copy beta tutorial assets
        working-directory: beta
        run: |
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/

      - name: Install development dependencies
        working-directory: dev-src
        run: npm ci --no-audit --no-fund

      - name: Build development
        working-directory: dev-src
        run: npx vite build --base=/TopdownCraftrace/dev/

      - name: Copy development tutorial assets
        working-directory: dev-src
        run: |
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/

      - name: Add development build under dev
        run: |
          rm -rf beta/dist/dev
          mkdir -p beta/dist/dev
          cp -R dev-src/dist/. beta/dist/dev/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: beta/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
