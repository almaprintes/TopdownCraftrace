name: Deploy Top Down Race

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public beta
        uses: actions/checkout@v4
        with:
          ref: beta-1.0
          path: beta
          fetch-depth: 1
      - name: Read beta revision
        id: beta-rev
        working-directory: beta
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore frozen beta build
        id: beta-cache
        uses: actions/cache@v4
        with:
          path: beta/dist
          key: tdr-public-beta-${{ steps.beta-rev.outputs.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: dev-src
          fetch-depth: 1
      - name: Verify race wrappers
        working-directory: dev-src
        shell: bash
        run: |
          test -f src/game/scenes/RaceNoDiagScene.js
          test -f src/game/scenes/RaceStaticMinimapScene.js
          test -f src/game/scenes/RaceStaticGhostStatusScene.js
          test -f src/game/scenes/RaceTop10ReplayScene.js
          test -f src/game/scenes/RaceReplayCleanScene.js
          test -f src/game/scenes/RaceEmbeddedReplayScene.js
          test -f src/game/stats/localRaceRecords.js
          test -f src/game/scenes/StatsBroadcastScene.js
          test -f src/game/scenes/StatsBroadcastCompactScene.js
          test -f src/game/scenes/StatsBroadcastReplayScene.js
          test -f src/game/scenes/StatsBroadcastRealReplayScene.js
          grep -q "RaceEmbeddedReplayScene.js" src/game/game.js
          grep -q "StatsBroadcastRealReplayScene.js" src/game/game.js
          grep -q "this._diag = () => {}" src/game/scenes/RaceNoDiagScene.js
          grep -q "tdr-static-minimap" src/game/scenes/RaceStaticMinimapScene.js
          grep -q "tdr-static-ghost-status" src/game/scenes/RaceStaticGhostStatusScene.js
          grep -q "tdr2:topReplay:" src/game/scenes/RaceTop10ReplayScene.js
          grep -q "tdr2:statsNativeReplay" src/game/scenes/RaceTop10ReplayScene.js
          grep -q "RACE CONTROL // REPLAY REAL" src/game/scenes/RaceTop10ReplayScene.js
          grep -q "REPLAY_SPEEDS" src/game/scenes/RaceTop10ReplayScene.js
          grep -q "data-seek" src/game/scenes/RaceTop10ReplayScene.js
          grep -q "_stepStatsReplaySample" src/game/scenes/RaceTop10ReplayScene.js
          grep -q "tdr-native-replay-clean" src/game/scenes/RaceReplayCleanScene.js
          grep -q "depth>=900" src/game/scenes/RaceReplayCleanScene.js
          grep -q "interactive" src/game/scenes/RaceReplayCleanScene.js
          grep -q "#tdr-race-controls" src/game/scenes/RaceReplayCleanScene.js
          grep -q "#tdr-handbrake" src/game/scenes/RaceReplayCleanScene.js
          grep -q "#tdr-steering-wheel" src/game/scenes/RaceReplayCleanScene.js
          grep -q "data-tdr-embedded-feed" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "_copyEmbeddedReplayFrame" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "drawImage" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "postrender" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "_stopEmbeddedFeedLoop" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "_drawReplayAnalysis" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "ANÁLISIS TRAZADA" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "TRAZADA ✓" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "RITMO" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "pxpsToKmh" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "sampleSpeedAtTime" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "samplePositionAt" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "km/h" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "centerOn" src/game/scenes/RaceEmbeddedReplayScene.js
          grep -q "matchingLap" src/game/stats/localRaceRecords.js
          grep -q "br-brand-watermark" src/game/scenes/StatsBroadcastScene.js
          grep -q "logo_.*_negativo" src/game/scenes/StatsBroadcastScene.js
          grep -q "br-record-car" src/game/scenes/StatsBroadcastScene.js
          grep -q "br-native-active" src/game/scenes/StatsBroadcastRealReplayScene.js
          grep -q "grid-auto-rows:max-content" src/game/scenes/StatsBroadcastRealReplayScene.js
          grep -q "cloneNode" src/game/scenes/StatsBroadcastRealReplayScene.js
          grep -q "br-chart" src/game/scenes/StatsBroadcastRealReplayScene.js
          grep -q "embedded:true" src/game/scenes/StatsBroadcastRealReplayScene.js
          grep -q "scene.launch('race'" src/game/scenes/StatsBroadcastRealReplayScene.js
      - name: Build development
        working-directory: dev-src
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          npm ci --no-audit --no-fund
          npx vite build --base=/TopdownCraftrace/dev/
          sed -i -E 's/DEV 1\.0\.[0-9]+/DEV 1.0.68/g' dist/index.html
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/
      - name: Assemble public beta plus DEV
        shell: bash
        run: |
          rm -rf beta/dist/dev beta/dist/dev-live
          mkdir -p beta/dist/dev beta/dist/dev-live
          cp -R dev-src/dist/. beta/dist/dev/
          cp -R dev-src/dist/. beta/dist/dev-live/
      - name: Verify DEV artifact
        shell: bash
        run: |
          cmp dev-src/dist/index.html beta/dist/dev/index.html
          cmp dev-src/dist/index.html beta/dist/dev-live/index.html
          test -f beta/dist/dev/sw.js
          test -f beta/dist/dev-live/sw.js
          grep -q 'DEV 1\.0\.68' beta/dist/dev/index.html
          grep -q 'DEV 1\.0\.68' beta/dist/dev-live/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: beta/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
