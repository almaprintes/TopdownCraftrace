name: Deploy Top Down Race

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public beta
        uses: actions/checkout@v4
        with:
          ref: beta-0.0.3
          path: beta
          fetch-depth: 1

      - name: Read beta revision
        id: beta-rev
        working-directory: beta
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore frozen beta build
        id: beta-cache
        uses: actions/cache@v4
        with:
          path: beta/dist
          key: tdr-public-beta-${{ steps.beta-rev.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build frozen beta once
        if: steps.beta-cache.outputs.cache-hit != 'true'
        working-directory: beta
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx vite build --base=/TopdownCraftrace/
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/

      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: main
          path: dev-src
          fetch-depth: 1

      - name: Build development
        working-directory: dev-src
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx vite build --base=/TopdownCraftrace/dev/
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/

      - name: Assemble public beta plus DEV
        shell: bash
        run: |
          rm -rf beta/dist/dev
          mkdir -p beta/dist/dev
          cp -R dev-src/dist/. beta/dist/dev/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: beta/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
