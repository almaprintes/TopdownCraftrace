name: LIVE 4 G · selector IA Elo por plaza (sin deploy)
on:
  pull_request:
    paths:
      - 'src/game/online/craftraceLive4AiSelection.js'
      - 'src/game/online/craftraceLiveV2RaceSession.js'
      - 'src/game/online/craftraceLiveV2BotDirector.js'
      - 'src/game/online/craftraceLiveV2RaceBridge.js'
      - 'src/game/online/craftraceLiveV2PilotNames.js'
      - 'src/game/ui/craftraceLiveV2Lobby.js'
      - 'src/game/ui/craftraceLiveV2Lobby.css'
      - 'scripts/craftrace-live4-ai-picker-smoke.mjs'
      - 'scripts/craftrace-live4-canarias-vs-bezier-smoke.mjs'
      - '.github/workflows/craftrace-live4-ai-picker-elo.yml'
jobs:
  host-ai-selection:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare source circuits
        run: |
          npm ci --no-audit --no-fund
          node scripts/install-santa-cruz-source.mjs
          node scripts/install-karting-canarias-4096-source.mjs
      - name: Check JS syntax and pilot selection
        run: |
          node --check src/game/online/craftraceLive4AiSelection.js
          node --check src/game/online/craftraceLiveV2RaceSession.js
          node --check src/game/ui/craftraceLiveV2Lobby.js
          node --check src/game/online/craftraceLiveV2RaceBridge.js
          node --check src/game/online/craftraceLiveV2BotDirector.js
          node scripts/craftrace-live4-ai-picker-smoke.mjs
          node scripts/craftrace-live4-canarias-vs-bezier-smoke.mjs
          node scripts/craftrace-live4-rematch-roster-venue-smoke.mjs
      - name: Full DEV build with all prebuild regressions
        run: npm run build:dev
