name: LIVE 4 · Humano vs expertos Bézier Canarias (no deploy)
on:
  pull_request:
    paths:
      - 'src/game/online/craftraceLive4GuidedGExperiment.js'
      - 'src/game/online/craftraceLiveV2BotDirector.js'
      - 'src/game/online/craftraceLiveV2RaceBridge.js'
      - 'src/game/ui/craftraceLiveV2Lobby.js'
      - 'scripts/craftrace-live4-canarias-vs-bezier-smoke.mjs'
      - '.github/workflows/craftrace-live4-canarias-vs-bezier.yml'
jobs:
  human-vs-g:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install original photographed circuits
        run: |
          npm ci --no-audit --no-fund
          node scripts/install-santa-cruz-source.mjs
          node scripts/install-karting-canarias-4096-source.mjs
      - name: Verify human vs 3 trained experts + Santa Cruz regression
        run: |
          node --check src/game/online/craftraceLive4GuidedGExperiment.js
          node --check src/game/online/craftraceLiveV2BotDirector.js
          node --check src/game/online/craftraceLiveV2RaceBridge.js
          node --check src/game/ui/craftraceLiveV2Lobby.js
          node scripts/craftrace-live4-canarias-vs-bezier-smoke.mjs
          node scripts/craftrace-live4-guided-g-host-smoke.mjs
          node scripts/craftrace-live-v2-lobby-smoke.mjs
