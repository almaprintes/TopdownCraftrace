name: TDR PostgreSQL lab (no Mac storage)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tdr-postgres-lab.yml
      - scripts/tdr-postgres-ghost-lab.mjs
      - supabase/migrations/20261030_033_online_ghost_structural_validation.sql
      - src/game/online/onlineGhostCodec.js
      - scripts/cloud-save-rpc-privilege-smoke.mjs
      - supabase/migrations/20261031_035_cloud_save_rpc_only_permissions.sql
      - supabase/migrations/20261030_032_skip_identical_cloud_progress_writes.sql
      - src/game/online/serverGeometryJudge.js
      - src/server/raceEditionRegistry.js
      - config/online-trusted-editions.json
      - scripts/tdr-edition-registry-lab.mjs
      - config/online-trusted-physics.json
      - src/server/trustedVehiclePhysics.js
      - scripts/tdr-vehicle-physics-lab.mjs
      - scripts/google-web-auth-smoke.mjs
      - scripts/anonymous-auth-identity-smoke.mjs
      - scripts/race-control-identity-recovery-smoke.mjs
      - src/game/online/googleWebAuth.js
      - src/game/online/raceControlOnline.js
      - src/game/social/cloudProgress.js
      - src/game/social/cloudAutoSync.js
      - src/game/cars/carSpecs.js
      - public/assets/data/car_overrides.json
      - src/game/cars/resolveCarParams.js
      - src/game/cars/cuperDrivingPhysics.js
      - src/game/garage/garageStore.js
      - scripts/tdr-tenerife-geometry-lab.mjs
      - src/game/tracks/library/karting-tenerife/track.json
      - src/game/tracks/closedCircuitGateOrder.js
      - src/game/tracks/TrackBuilder.js
      - src/game/tracks/raceGateWidth.js

permissions:
  contents: read

jobs:
  postgres-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: ci-temporary-only
          POSTGRES_DB: tdr_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab -d tdr_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: lab
      PGPASSWORD: ci-temporary-only
      PGDATABASE: tdr_lab
    steps:
      - name: Fetch the game source
        uses: actions/checkout@v4
      - name: Node 22 (no npm dependencies)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PostgreSQL command-line client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Test direct DML closure and cloud-save RPC in isolated PostgreSQL
        run: node scripts/cloud-save-rpc-privilege-smoke.mjs
      - name: OAuth Google PKCE and safe manual identity-linking contract
        run: node scripts/google-web-auth-smoke.mjs
      - name: Preserve permanent and anonymous IDs on auth refresh
        run: node scripts/anonymous-auth-identity-smoke.mjs
      - name: Preserve records when old nickname/UUID conflicts
        run: node scripts/race-control-identity-recovery-smoke.mjs
      - name: Verify ghost codec contract
        run: node scripts/ghost-structural-integrity-smoke.mjs
      - name: Shadow-judge real Tenerife authored road, checkpoints and cuts
        run: node scripts/tdr-tenerife-geometry-lab.mjs
      - name: Reject unapproved changes of official server geometry editions
        run: node scripts/tdr-edition-registry-lab.mjs
      - name: Cross-check official vehicle physics and reject unapproved changes
        run: node scripts/tdr-vehicle-physics-lab.mjs
      - name: Verify real SQL validator in temporary PostgreSQL
        run: node scripts/tdr-postgres-ghost-lab.mjs
