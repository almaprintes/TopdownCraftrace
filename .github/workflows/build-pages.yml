name: Build Top Down RACE for Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topdown-pages-build
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout real project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore clean source index
        run: cp .github/source-index.html index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build real game
        env:
          BASE: /TopdownCraftrace/
        run: npm run build

      - name: Wait for branch Pages deployment
        run: |
          echo "Waiting for the automatic Pages deployment triggered by the source commit to finish..."
          sleep 75

      - name: Publish build to main root
        shell: bash
        run: |
          set -euo pipefail

          # Nunca versionar dependencias ni la carpeta de trabajo de Vite.
          git rm -r --cached --ignore-unmatch node_modules dist || true

          # Copiar SOLO el resultado publicable a la raíz de Pages.
          cp -R dist/. ./
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Añadir cambios, respetando .gitignore.
          git add -A

          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "Publish Top Down RACE Garage Fusion build [skip ci]"
            git push origin main
          fi
