name: Build Top Down RACE to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topdown-gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout real project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore clean source index
        run: cp .github/source-index.html index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build real game
        env:
          BASE: /TopdownCraftrace/
        run: npm run build

      - name: Publish dist to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          touch dist/.nojekyll

          rm -rf /tmp/topdown-gh-pages
          git worktree add /tmp/topdown-gh-pages gh-pages

          cd /tmp/topdown-gh-pages
          git rm -r --ignore-unmatch . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/dist/." ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "Deploy Top Down RACE ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi
