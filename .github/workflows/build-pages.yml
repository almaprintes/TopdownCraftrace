name: Build Top Down RACE preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topdown-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout real project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore clean source index
        run: cp .github/source-index.html index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build fast preview
        env:
          BASE: ./
        run: npm run build

      - name: Copy dropping tutorial assets
        run: |
          mkdir -p dist/assets/tutorials/dropping
          cp -R assets/tutorials/dropping/. dist/assets/tutorials/dropping/

      - name: Publish dist to preview branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/topdown-preview
          git worktree add /tmp/topdown-preview preview

          cd /tmp/topdown-preview
          git rm -r --ignore-unmatch . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/dist/." ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No preview changes"
          else
            git commit -m "Preview Top Down RACE ${GITHUB_SHA::7}"
            git push origin preview
          fi
