# Manual bounded PolyHaven bake. Atlántico and Raven Hollow are protected.
name: Bake all tracks beauty

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  NODE_OPTIONS: --max-old-space-size=6144
  VIPS_CONCURRENCY: '1'

jobs:
  bake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build protected target list
        id: targets
        run: |
          set -euxo pipefail
          find src/game/tracks/library -mindepth 2 -maxdepth 2 -name track.json -printf '%h\n' \
            | xargs -n1 basename \
            | grep -v -E '^(track01|offroad-raven-hollow)$' \
            | sort > /tmp/beauty-targets.txt
          cat /tmp/beauty-targets.txt
          test "$(wc -l < /tmp/beauty-targets.txt)" -eq 14
          test -f public/assets/tracks/track01/beauty/manifest.json
          test -f public/assets/tracks/offroad-raven-hollow/beauty/manifest.json

      - name: Bake 14 tracks with approved generic baker
        run: |
          set -euxo pipefail
          while IFS= read -r KEY; do
            node scripts/bake-track-beauty.mjs "$KEY"
          done < /tmp/beauty-targets.txt

      - name: Publish only the 14 generated tracks
        run: |
          set -euxo pipefail
          while IFS= read -r KEY; do
            SRC="artifacts/track-beauty/$KEY"
            DEST="public/assets/tracks/$KEY/beauty"
            test -f "$SRC/manifest.json"
            mkdir -p "$DEST"
            rm -f "$DEST"/*-beauty-preview.webp "$DEST"/*-beauty-[0-9].webp "$DEST/manifest.json"
            cp "$SRC/$KEY-beauty-preview.webp" "$DEST/"
            cp "$SRC/$KEY-beauty-0.webp" "$DEST/"
            cp "$SRC/$KEY-beauty-1.webp" "$DEST/"
            cp "$SRC/$KEY-beauty-2.webp" "$DEST/"
            cp "$SRC/$KEY-beauty-3.webp" "$DEST/"
            cp "$SRC/manifest.json" "$DEST/"
          done < /tmp/beauty-targets.txt
          node scripts/build-track-beauty-catalog.mjs

      - name: Verify protected tracks and complete 16-track catalog
        run: |
          set -euxo pipefail
          test -f public/assets/tracks/track01/beauty/manifest.json
          test -f public/assets/tracks/offroad-raven-hollow/beauty/manifest.json
          grep -q 'track01' src/game/tracks/trackBeautyLayers.generated.js
          grep -q 'offroad-raven-hollow' src/game/tracks/trackBeautyLayers.generated.js
          test "$(grep -c 'useBeautyLayer: true' src/game/tracks/trackBeautyLayers.generated.js)" -eq 16
          git diff --exit-code -- public/assets/tracks/track01/beauty
          git diff --exit-code -- public/assets/tracks/offroad-raven-hollow/beauty

      - name: Commit generated assets
        id: commit_assets
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/tracks src/game/tracks/trackBeautyLayers.generated.js
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Bake PolyHaven beauty for remaining 14 tracks'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Trigger fresh preview and Pages builds
        if: steps.commit_assets.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-pages.yml --ref main || true
          gh workflow run pages.yml --ref main || true
