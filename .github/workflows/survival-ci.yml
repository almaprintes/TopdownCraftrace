name: Survival Rebuild CI

on:
  push:
    branches: [rebuild/survival-clean]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Stability checks
        run: npm run check:stability

      - name: Survival checks
        run: npm run check:survival

      - name: Production build
        run: npm run build -- --base=/TopdownCraftrace/
