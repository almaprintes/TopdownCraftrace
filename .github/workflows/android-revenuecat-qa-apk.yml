name: TDR real AdMob RevenueCat minified QA APK
# DEV 1.2.314: owner-requested consolidated Android test after induction, Arafo, online ranking and pilot-geography fixes.
# DEV 1.2.216: include corrected Karting staging in all main Android checks.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-revenuecat-qa-apk.yml'
      - 'assets/branding/tdr-play-store-icon.png'
      - 'scripts/generate-android-launcher-icons.mjs'
      - 'scripts/verify-android-launcher.mjs'
      - 'scripts/android-release-candidate-smoke.mjs'
      - 'src/game/scenes/RaceProceduralAudioScene.js'
      - 'src/game/audio/CarEngineSampleRuntime.js'
      - 'src/main.js'
      - 'src/game/monetization/RewardedAdsProvider.js'
      - 'src/game/monetization/installNativeRewardedBridge.js'
      - 'src/game/audio/MenuMusic.js'
      - 'scripts/rewarded-audio-focus-smoke.mjs'
      - 'src/game/social/**'
      - 'src/game/online/**'
      - 'src/game/ui/LobbyDomUi.js'
      - 'src/game/seasons/**'
      - 'src/game/events/raceEvents.js'
      - 'scripts/cloud-portability-smoke.mjs'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real_ads_qa:
    # Runs on a deliberate workflow change or manual dispatch. A web-only
    # commit marked [pwa-only] must not trigger a real-ad test package.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk-qa]') || !contains(github.event.head_commit.message, '[pwa-only]') }}
    name: Build separate physical Redmi QA app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE: ./
      TDR_CI_BRIDGE_TEST: '1' # QA debug-key signing for isolated release; not Play
      TDR_ANDROID_TEST_BUILD_TYPE: release
      VITE_TDR_ONLINE_URL: ${{ vars.VITE_TDR_ONLINE_URL }}
      VITE_TDR_ONLINE_PUBLIC: ${{ vars.VITE_TDR_ONLINE_PUBLIC }}
      # These three identifiers are PUBLIC Android app/SDK identifiers by design.
      # They are bundled into the distributable app, not secret/private API keys.
      TDR_ADMOB_APP_ID: ca-app-pub-1520547848869532~9780989345
      TDR_ADMOB_REWARDED_UNIT_ID: ca-app-pub-1520547848869532/2605472830
      TDR_REVENUECAT_PUBLIC_SDK_KEY: goog_dkfPGMwMaCAVUhyeibbGQOZMAiC
      # This build exercises LIVE ad inventory. Do not use it for repeated
      # artificial impression generation. Use bridgeTest for frequent testing.
      TDR_ADMOB_TEST_DEVICE_IDS: ''
    steps:
      - name: Checkout merged DEV from exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK
        shell: bash
        run: |
          test -n "${ANDROID_HOME}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build Android web payload with approved launcher
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          # Karting Tenerife is image-native: stage its canonical full-resolution
          # WebP and split beauty tiles before build:prod checks their existence.
          node scripts/install-karting-tenerife-source.mjs
          node scripts/karting-official-source-smoke.mjs
          node scripts/rewarded-audio-focus-smoke.mjs
          node scripts/coin-reward-flight-smoke.mjs
          node scripts/recycler-premium-ui-smoke.mjs
          node scripts/inventory-premium-ui-smoke.mjs
          node scripts/cuper-season-smoke.mjs
          node scripts/release-language-audit.mjs
          node scripts/lobby-reward-ready-glow-smoke.mjs
          node scripts/cloud-portability-smoke.mjs
          npm run build:android
          node scripts/karting-canarias-4096-smoke.mjs
          node scripts/android-release-candidate-smoke.mjs
          node scripts/verify-android-launcher.mjs
      - name: Compile APK with real AdMob and RevenueCat integrations
        working-directory: android
        run: ./gradlew :app:testDeviceTestReleaseUnitTest :app:assembleDeviceTestRelease --stacktrace
      - name: Validate separate package and APK
        shell: bash
        run: |
          set -euo pipefail
          src='android/app/build/outputs/apk/deviceTest/release/app-deviceTest-release.apk'
          test -s "$src"
          unzip -t "$src" | tail -1
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$src" | grep "package: name='com.craftracestudio.topdownrace.rewardedtest'"
          mkdir -p sdk-download
          cp "$src" sdk-download/TDR-QA-DEV-1.2.314-REAL-ADS-SIN-MEDIR.apk
          sha256sum sdk-download/TDR-QA-DEV-1.2.314-REAL-ADS-SIN-MEDIR.apk
          ls -lh sdk-download/*.apk
      - name: Make installable Redmi APK available
        uses: actions/upload-artifact@v4
        with:
          name: TDR-QA-DEV-1.2.314-REAL-ADS-SIN-MEDIR
          path: sdk-download/TDR-QA-DEV-1.2.314-REAL-ADS-SIN-MEDIR.apk
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Make direct-download GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          apk='sdk-download/TDR-QA-DEV-1.2.314-REAL-ADS-SIN-MEDIR.apk'
          tag='tdr-qa-1.2.314'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --prerelease \
              --title 'Top Down Race · APK de pruebas DEV 1.2.314' \
              --notes 'APK Android QA DEV 1.2.314 para pruebas en dispositivos reales. Incluye actualizaciones de Arafo-Los Loros, sincronización de misión 7 de Inducción, recuperación de récords online de Atlántico y formulario voluntario de continente/país/región para rankings. App independiente del juego de Google Play; AdMob y RevenueCat reales; herramienta MEDIR oculta, solo disponible mediante acceso de asistencia. Probar inducción, clasificación por zonas, anuncios y fluidez Android sin generar impresiones publicitarias artificiales. No es una actualización pública.'
          fi
