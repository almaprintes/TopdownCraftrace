name: TDR safe Google demo ads minified QA APK
# QA 1.2.336: demo-only AdMob inventory; no paid impressions from test devices.
# Rerun: first-entry version parser no longer escapes too many characters.
# DEV 1.2.335: corrected first-entry test to accept subsequent versions.
# QA DEV 1.2.335: Android native JSON export + Atlantico Inverso fix, full approved game; never Play.
# DEV 1.2.216: include corrected Karting staging in all main Android checks.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-revenuecat-qa-apk.yml'
      - 'assets/branding/tdr-play-store-icon.png'
      - 'scripts/generate-android-launcher-icons.mjs'
      - 'scripts/verify-android-launcher.mjs'
      - 'scripts/android-release-candidate-smoke.mjs'
      - 'scripts/android-qa-signing-smoke.mjs'
      - 'scripts/android-test-ads-safety-smoke.mjs'
      - 'android/app/build.gradle'
      - 'android/app/src/main/java/com/craftracestudio/topdownrace/TdrRewardedAdsPlugin.kt'
      - 'src/game/scenes/RaceProceduralAudioScene.js'
      - 'src/game/audio/CarEngineSampleRuntime.js'
      - 'src/main.js'
      - 'src/game/monetization/RewardedAdsProvider.js'
      - 'src/game/monetization/installNativeRewardedBridge.js'
      - 'src/game/audio/MenuMusic.js'
      - 'scripts/rewarded-audio-focus-smoke.mjs'
      - 'src/game/social/**'
      - 'src/game/online/**'
      - 'src/game/ui/LobbyDomUi.js'
      - 'src/game/seasons/**'
      - 'src/game/events/raceEvents.js'
      - 'scripts/cloud-portability-smoke.mjs'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: write

# Prevent simultaneous QA builds from racing to create a replacement signing key.
concurrency:
  group: tdr-device-qa-signing
  cancel-in-progress: false

jobs:
  safe_demo_ads_qa:
    # Runs on deliberate changes or manual dispatch. Always demo-only;
    # a web-only commit marked [pwa-only] should not regenerate the APK.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk-qa]') || !contains(github.event.head_commit.message, '[pwa-only]') }}
    name: Build separate physical Redmi QA app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE: ./
      TDR_CI_BRIDGE_TEST: '1' # isolated QA release only; never Play
      TDR_CI_QA_STABLE_SIGNING: '1' # use the explicitly restored keystore, not the implicit Gradle debug signer
      # Pinned public fingerprint of the first persistent QA identity. Never
      # silently regenerate another signer after Actions cache expiration.
      TDR_QA_EXPECTED_SIGNER_SHA256: cd626199aa6234d9bdc3c07ca0c8686e7fb994eb8c4d5d02ade2fff1dcbeca6f
      TDR_ANDROID_TEST_BUILD_TYPE: release
      VITE_TDR_ONLINE_URL: ${{ vars.VITE_TDR_ONLINE_URL }}
      VITE_TDR_ONLINE_PUBLIC: ${{ vars.VITE_TDR_ONLINE_PUBLIC }}
      # No live ad identifiers or RevenueCat verification key in this job.
      # deviceTest receives Google's demo app + rewarded unit at Gradle level.
      # Sample rewards intentionally do not produce RevenueCat verified claims.
    steps:
      - name: Checkout merged DEV from exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # GitHub-hosted runners normally regenerate the Android debug signer,
      # making a later APK impossible to install over the previous QA build.
      # Cache ONLY the isolated .rewardedtest QA signing identity. Play's
      # production keystore is neither present nor accessible here.
      # NOTE: GitHub caches expire; for long-term QA upgrades configure a
      # repository-secret-backed signer rather than treating this as permanent.
      - name: Reuse QA Android signer across runs
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tdr-rewardedtest-debug-signing-v1
      - name: Require the original cached QA signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if test ! -s "$HOME/.android/debug.keystore"; then
            echo "::error::Original QA signing key missing. Refusing to create a replacement."
            exit 1
          fi
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep 'SHA256:' | head -1
          expected="$TDR_QA_EXPECTED_SIGNER_SHA256"
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -1)"
          if test -z "$actual" || test "$expected" != "$actual"; then
            echo "::error::QA signing keystore is missing or changed. STOP: existing installs cannot be upgraded with a new key."
            exit 1
          fi
      - name: Install Android SDK
        shell: bash
        run: |
          test -n "${ANDROID_HOME}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Audit certificates of published .300 and .317 APKs before replacement
        id: legacy_signers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prior-apks
          echo '### Certificados APK QA existentes vs nueva cadena' >> "$GITHUB_STEP_SUMMARY"
          for version in 300 317 325 328; do
            apk="TDR-QA-DEV-1.2.${version}-REAL-ADS-SIN-MEDIR.apk"
            gh release download "tdr-qa-1.2.${version}" --repo "$GITHUB_REPOSITORY" --pattern "$apk" --dir prior-apks
            path="prior-apks/$apk"
            test -s "$path"
            badging="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$path")"
            printf '%s\n' "$badging" | grep -Fq "name='com.craftracestudio.topdownrace.rewardedtest'"
            report="$("${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$path")"
            cert="$(printf '%s\n' "$report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | head -1)"
            test -n "$cert"
            echo "cert_${version}=$cert" >> "$GITHUB_OUTPUT"
            echo "- **.${version}**: \u0060$cert\u0060" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$badging" | grep '^package:'
            printf '%s\n' "$report" | grep -E 'Verified using|Signer #1 certificate SHA-256'
            if test "$version" = "317"; then
              if test "$cert" != "63c30fb33ef62289ffce961a8dadc2efe85480ce121b1043996370a6949d4358"; then
                echo "::error::Published .317 signer differs from previously audited certificate; investigate before distribution."
                exit 1
              fi
            fi
            if test "$version" = "325"; then
              printf '%s\n' "$badging" | grep -Fq "versionCode='1000325'"
              if test "$cert" != "$TDR_QA_EXPECTED_SIGNER_SHA256"; then
                echo "::error::Installed QA .325 signer differs from new .328. Do NOT uninstall; refusing incompatible update."
                exit 1
              fi
              echo '- La .325 y la nueva .328 comparten certificado: actualización in situ compatible por firma y versionCode.' >> "$GITHUB_STEP_SUMMARY"
            fi
            if test "$version" = "328"; then
              printf '%s\n' "$badging" | grep -Fq "versionCode='1000328'"
              if test "$cert" != "$TDR_QA_EXPECTED_SIGNER_SHA256"; then
                echo "::error::QA .328 signing changed. Stop to preserve installed data."
                exit 1
              fi
            fi
            if test "$version" = "300"; then
              if test "$cert" = "$TDR_QA_EXPECTED_SIGNER_SHA256"; then
                echo 'can_upgrade_300=true' >> "$GITHUB_OUTPUT"
                echo '- APK nueva y .300 tienen la misma firma: actualización posible si los demás requisitos Android se cumplen.' >> "$GITHUB_STEP_SUMMARY"
              else
                echo 'can_upgrade_300=false' >> "$GITHUB_OUTPUT"
                echo '::warning::APK .300 certificate differs from this QA signer. NEVER uninstall .300 without verified backup/recovery; Android will reject in-place update.'
                echo '- **INCOMPATIBLE con instalación in situ sobre .300**: conservar .300 hasta restauración de datos comprobada.' >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done
          echo "- **Nuevo firmante .328 esperado**: \u0060$TDR_QA_EXPECTED_SIGNER_SHA256\u0060" >> "$GITHUB_STEP_SUMMARY"
      - name: Build Android web payload with approved launcher
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          # Karting Tenerife is image-native: stage its canonical full-resolution
          # WebP and split beauty tiles before build:prod checks their existence.
          node scripts/install-karting-tenerife-source.mjs
          node scripts/karting-official-source-smoke.mjs
          node scripts/rewarded-audio-focus-smoke.mjs
          node scripts/coin-reward-flight-smoke.mjs
          node scripts/recycler-premium-ui-smoke.mjs
          node scripts/inventory-premium-ui-smoke.mjs
          node scripts/cuper-season-smoke.mjs
          node scripts/release-language-audit.mjs
          node scripts/lobby-reward-ready-glow-smoke.mjs
          node scripts/cloud-portability-smoke.mjs
          node scripts/android-portable-save-smoke.mjs
          node scripts/environment-first-entry-isolation-smoke.mjs
          node scripts/ghost-static-panel-zoom-smoke.mjs
          node scripts/ghost-atlantico-world-version-smoke.mjs
          node scripts/session-insight-bank-smoke.mjs
          npm run build:android
          # The physical Android QA app MUST contain the latest inverse route,
          # original Environment Studio colliders and complete Race Control UI.
          node scripts/all-circuit-directions-smoke.mjs
          node scripts/inverse-environment-collisions-smoke.mjs
          node scripts/race-control-full-circuit-names-smoke.mjs
          node scripts/race-pause-timing-smoke.mjs
          node scripts/karting-canarias-4096-smoke.mjs
          node scripts/android-release-candidate-smoke.mjs
          node scripts/android-test-ads-safety-smoke.mjs
          node scripts/android-qa-signing-smoke.mjs
          node scripts/verify-android-launcher.mjs
      - name: Compile APK with Google demo ads only (no paid inventory)
        working-directory: android
        run: ./gradlew :app:testDeviceTestReleaseUnitTest :app:assembleDeviceTestRelease --stacktrace
      - name: Validate separate package and APK
        shell: bash
        run: |
          set -euo pipefail
          src='android/app/build/outputs/apk/deviceTest/release/app-deviceTest-release.apk'
          test -s "$src"
          unzip -t "$src" | tail -1
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$src" | grep "package: name='com.craftracestudio.topdownrace.rewardedtest'.*versionCode='1000336'"
          apk_sign_report="$("${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$src")"
          printf '%s\n' "$apk_sign_report" | grep -E 'Verified using|Signer #1 certificate SHA-256'
          apk_cert="$(printf '%s\n' "$apk_sign_report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
          if test -z "$apk_cert" || test "$apk_cert" != "$TDR_QA_EXPECTED_SIGNER_SHA256"; then
            echo "::error::APK certificate does not match the persisted QA keystore. Refusing to distribute an incompatible APK."
            exit 1
          fi
          mkdir -p sdk-download
          cp "$src" sdk-download/TDR-QA-DEV-1.2.336-ANUNCIOS-DE-PRUEBA.apk
          sha256sum sdk-download/TDR-QA-DEV-1.2.336-ANUNCIOS-DE-PRUEBA.apk
          ls -lh sdk-download/*.apk
      - name: Make installable Redmi APK available
        uses: actions/upload-artifact@v4
        with:
          name: TDR-QA-DEV-1.2.336-ANUNCIOS-DE-PRUEBA
          path: sdk-download/TDR-QA-DEV-1.2.336-ANUNCIOS-DE-PRUEBA.apk
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Make direct-download GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          apk='sdk-download/TDR-QA-DEV-1.2.336-ANUNCIOS-DE-PRUEBA.apk'
          tag='tdr-qa-1.2.336'
          cat > qa-release-notes.md <<EOF
          APK Android QA 1.2.336 compilada desde main. Contiene la DEV del commit exacto con circuitos, controles, Race Control, RALLY, temporadas, Supabase y Google AdMob DEMO. No envía impresiones monetizadas a la cuenta TDR. Los anuncios de demostración NO verifican recompensas vía RevenueCat: es intencional; probar SSV real solo con dispositivos registrados y redes correctamente configuradas. applicationId com.craftracestudio.topdownrace.rewardedtest, versionCode 1000336. No se publica en Play.

          CERTIFICADOS REALES AUDITADOS:
          - .300: ${{ steps.legacy_signers.outputs.cert_300 }}
          - .317: ${{ steps.legacy_signers.outputs.cert_317 }}
          - .325: ${{ steps.legacy_signers.outputs.cert_325 }}\n          - .328: $TDR_QA_EXPECTED_SIGNER_SHA256
          - ¿Puede actualizar .300 con esta firma?: ${{ steps.legacy_signers.outputs.can_upgrade_300 }}

          AVISO SOBRE DATOS: la .325 y .328 deben tener mismo paquete, certificado real y versionCode creciente; instalación de actualización sin desinstalar. Si Android pide desinstalar o dice incompatible, CANCELAR e informar; nunca borrar datos. Copia online no equivale a archivo local: probar Descargas/JSON no vacío, cancelación y exportación local; NO restaurar sobre la partida vigente. No prometer conservación sin prueba física. La caché de firma CI no sustituye un backup permanente.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Immutable QA candidate already exists; refusing overwrite."
            exit 1
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --prerelease \
              --title 'Top Down Race · APK de prueba segura 1.2.336' \
              --notes-file qa-release-notes.md
          fi
