name: Bake Karting Tenerife beauty

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bake-karting-tenerife.yml'
      - 'scripts/bake-track-beauty.mjs'
      - 'scripts/track-beauty-config.mjs'
      - 'scripts/build-track-beauty-catalog.mjs'
      - 'src/game/tracks/TrackBuilder.js'
      - 'src/game/tracks/library/karting-tenerife/track.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bake-karting-tenerife
  cancel-in-progress: true

jobs:
  bake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bake Karting Tenerife only
        run: node scripts/bake-track-beauty.mjs karting-tenerife

      - name: Publish Karting Tenerife beauty assets
        run: |
          set -euo pipefail
          KEY='karting-tenerife'
          SRC="artifacts/track-beauty/$KEY"
          DEST="public/assets/tracks/$KEY/beauty"
          test -f "$SRC/$KEY-beauty-preview.webp"
          test -f "$SRC/$KEY-beauty-0.webp"
          test -f "$SRC/$KEY-beauty-1.webp"
          test -f "$SRC/$KEY-beauty-2.webp"
          test -f "$SRC/$KEY-beauty-3.webp"
          test -f "$SRC/manifest.json"
          mkdir -p "$DEST"
          rm -f "$DEST"/*-beauty-preview.webp "$DEST"/*-beauty-[0-9].webp "$DEST/manifest.json"
          cp "$SRC/$KEY-beauty-preview.webp" "$DEST/"
          cp "$SRC/$KEY-beauty-0.webp" "$DEST/"
          cp "$SRC/$KEY-beauty-1.webp" "$DEST/"
          cp "$SRC/$KEY-beauty-2.webp" "$DEST/"
          cp "$SRC/$KEY-beauty-3.webp" "$DEST/"
          cp "$SRC/manifest.json" "$DEST/"

      - name: Rebuild runtime beauty catalog from all published manifests
        run: node scripts/build-track-beauty-catalog.mjs

      - name: Verify frozen Atlantico remains present
        run: |
          set -euo pipefail
          test -f public/assets/tracks/track01/beauty/manifest.json
          grep -q 'atlantico-polyhaven-v10-clean-asphalt' public/assets/tracks/track01/beauty/manifest.json
          grep -q '"track01"' src/game/tracks/trackBeautyLayers.generated.js
          grep -q '"karting-tenerife"' src/game/tracks/trackBeautyLayers.generated.js

      - name: Commit generated Karting Tenerife assets
        id: commit_assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/tracks/karting-tenerife/beauty src/game/tracks/trackBeautyLayers.generated.js
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Bake Karting Tenerife beauty assets'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Trigger fresh preview and Pages builds
        if: steps.commit_assets.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-pages.yml --ref main || true
          gh workflow run pages.yml --ref main || true
