name: Bake Karting Tenerife beauty

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bake-karting-tenerife.yml'
      - 'scripts/bake-track-visual.mjs'
      - 'src/game/tracks/TrackBuilder.js'
      - 'src/game/tracks/library/karting-tenerife/track.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bake Karting Tenerife
        run: npm run bake:track -- karting-tenerife

      - name: Publish generated beauty assets
        run: |
          set -euo pipefail
          SRC='artifacts/track-beauty/karting-tenerife'
          DEST='public/assets/tracks/karting-tenerife/beauty'
          mkdir -p "$DEST"
          cp "$SRC/karting-tenerife-beauty-preview.webp" "$DEST/"
          cp "$SRC/karting-tenerife-beauty-0.webp" "$DEST/"
          cp "$SRC/karting-tenerife-beauty-1.webp" "$DEST/"
          cp "$SRC/karting-tenerife-beauty-2.webp" "$DEST/"
          cp "$SRC/karting-tenerife-beauty-3.webp" "$DEST/"
          cp "$SRC/manifest.json" "$DEST/"

      - name: Commit generated assets
        id: commit_assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/tracks/karting-tenerife/beauty
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Bake Karting Tenerife beauty assets'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Trigger fresh preview and Pages builds
        if: steps.commit_assets.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-pages.yml --ref main
          gh workflow run pages.yml --ref main
