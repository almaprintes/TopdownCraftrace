name: iOS read-only render audit smoke (no deploy)
on:
  push:
    branches:
      - diagnostics/ios-render-readonly-2026-11-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify diagnostic JS syntax
        run: |
          node --check src/game/performance/iosRenderAuditSnapshot.js
          node --check src/game/performance/iosWebglDrawCallSample.js
          node --check src/game/dev/iosRaceFrameDiagnostics.js
      - name: Verify camera snapshot is read-only
        run: node scripts/ios-render-audit-snapshot-smoke.mjs

      - name: Verify camera creation order (documentation guard)
        run: node scripts/ios-camera-creation-order-smoke.mjs

      - name: Run short WebGL sampler restoration test
        run: node scripts/ios-webgl-draw-sampler-smoke.mjs

  dev_build:
    name: Preflight DEV PWA bundle (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and generate official source assets
        run: |
          npm ci --no-audit --no-fund
          npm run predev
      - name: Compile complete iPhone DEV PWA
        run: |
          npx vite build --base=/TopdownCraftrace/dev/
          test -f dist/index.html
          grep -RFl 'GL: 90 FOTOGRAMAS' dist/assets >/dev/null
          grep -RFl 'INSPECCIONAR RENDER' dist/assets >/dev/null
          echo 'Preflight PWA compiled. No deploy was performed.'
