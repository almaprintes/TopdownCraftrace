name: Verify Android portable JSON plugin (compile only)

on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/java/com/craftracestudio/topdownrace/TdrPortableSavePlugin.java'
      - 'android/app/src/main/java/com/craftracestudio/topdownrace/MainActivity.java'
      - 'scripts/android-portable-save-smoke.mjs'
      - 'src/game/social/cloudProgress.js'
      - 'src/game/social/cloudAccountUi.js'
      - '.github/workflows/android-portable-save-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tdr-android-json-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile_native_plugin:
    name: Compile Capacitor Java without generating APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android compile SDK
        shell: bash
        run: |
          test -n "${ANDROID_HOME}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify source invariants and install Capacitor dependencies
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          node scripts/android-portable-save-smoke.mjs
          test -d node_modules/@capacitor/android
          # Capacitor generates the native plugin registry and Cordova
          # Gradle variables from a webDir. Supply a minimal temporary webDir:
          # no racing assets, APK packaging, signing or Play publication.
          mkdir -p dist
          printf '<!doctype html><html><head></head><body></body></html>\n' > dist/index.html
          npx cap sync android
          test -f android/capacitor-cordova-android-plugins/cordova.variables.gradle
          test -f android/app/src/main/assets/capacitor.plugins.json
      - name: Compile Android source without packaging or signing
        working-directory: android
        run: ./gradlew :app:compileBridgeTestDebugJavaWithJavac --stacktrace
