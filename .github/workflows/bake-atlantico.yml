name: Bake Atlantico beauty

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bake-atlantico-beauty.mjs'
      - '.github/workflows/bake-atlantico.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  NODE_OPTIONS: --max-old-space-size=4096
  VIPS_CONCURRENCY: '1'

jobs:
  bake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bake Circuito Atlantico
        run: |
          set -euxo pipefail
          node scripts/bake-atlantico-beauty.mjs

      - name: Publish four beauty tiles
        run: |
          set -euxo pipefail
          SRC='artifacts/track-beauty/track01'
          DEST='public/assets/tracks/track01/beauty'
          mkdir -p "$DEST"
          rm -f "$DEST"/track01-beauty-preview.webp "$DEST"/track01-beauty-[0-9].webp "$DEST"/manifest.json
          cp "$SRC/track01-beauty-preview.webp" "$DEST/"
          cp "$SRC/track01-beauty-0.webp" "$DEST/"
          cp "$SRC/track01-beauty-1.webp" "$DEST/"
          cp "$SRC/track01-beauty-2.webp" "$DEST/"
          cp "$SRC/track01-beauty-3.webp" "$DEST/"
          cp "$SRC/manifest.json" "$DEST/"
          cp artifacts/track-beauty/trackBeautyLayers.generated.js src/game/tracks/trackBeautyLayers.generated.js

      - name: Verify output
        run: |
          set -euxo pipefail
          test -f public/assets/tracks/track01/beauty/track01-beauty-0.webp
          test -f public/assets/tracks/track01/beauty/track01-beauty-3.webp
          grep -q 'track01' src/game/tracks/trackBeautyLayers.generated.js
          cat public/assets/tracks/track01/beauty/manifest.json
          ls -lh public/assets/tracks/track01/beauty

      - name: Commit generated assets
        id: commit_assets
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/tracks/track01/beauty src/game/tracks/trackBeautyLayers.generated.js
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Bake Atlantico Poly Haven beauty tiles'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Trigger fresh Pages builds
        if: steps.commit_assets.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-pages.yml --ref main || true
          gh workflow run pages.yml --ref main || true
