name: Android DEV installable QA APK (direct download)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-dev-installable-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

# No other APK/AAB/Play jobs are triggered by routine DEV commits.
concurrency:
  group: tdr-on-demand-device-qa
  cancel-in-progress: false

jobs:
  android_dev_apk:
    name: Signed isolated Android test APK and direct release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE: ./
      TDR_CI_BRIDGE_TEST: '1'
      TDR_ANDROID_TEST_BUILD_TYPE: release
    steps:
      - name: Checkout requested exact main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact commit and DEV marker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Eq 'name="tdr-dev-version" content="DEV [0-9]+[.][0-9]+[.][0-9]+"' index.html
          echo "source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build complete Android game and check distribution safeguards
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:android
          node scripts/android-release-candidate-smoke.mjs
          node scripts/ad-free-november-smoke.mjs
          node scripts/rewarded-access-smoke.mjs
          node scripts/verify-android-launcher.mjs
          node scripts/rc-twin-axis-controls-smoke.mjs
          node scripts/race-visible-control-hitbox-smoke.mjs
          node scripts/invisible-steering-controls-smoke.mjs
          node scripts/physics-ab-neutral-grip-smoke.mjs
      - name: Compile isolated signed minified APK and native tests
        working-directory: android
        run: ./gradlew :app:testBridgeTestReleaseUnitTest :app:assembleBridgeTestRelease --stacktrace
      - name: Verify APK is installable and is NOT the Play Store package
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          src='android/app/build/outputs/apk/bridgeTest/release/app-bridgeTest-release.apk'
          test -s "$src"
          unzip -t "$src" | tail -1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$src" | tee apk-certificate.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$src" | tee apk-badging.txt
          grep -Fq "package: name='com.craftracestudio.topdownrace.bridgetest'" apk-badging.txt
          dev="$(grep -oE 'name="tdr-dev-version" content="DEV [0-9]+[.][0-9]+[.][0-9]+"' index.html | head -1 | sed -E 's/^.*DEV ([0-9.]+)"$/\1/')"
          test -n "$dev"
          short="$(git rev-parse --short=12 HEAD)"
          name="TDR-Android-DEV-$dev-TEST-$short.apk"
          mkdir -p device-apk
          cp "$src" "device-apk/$name"
          sha256sum "device-apk/$name" | tee apk-sha256.txt
          echo "apk_name=$name" >> "$GITHUB_OUTPUT"
          echo "release_tag=tdr-android-qa-$short" >> "$GITHUB_OUTPUT"
          echo "DEV $dev test APK, package .bridgetest; Play app not modified." >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $(cat apk-sha256.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve backup in Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TDR-Android-DEV-test-${{ github.sha }}
          path: device-apk/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish direct APK download as a GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.apk.outputs.release_tag }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
        run: |
          set -euo pipefail
          test -s "device-apk/$APK_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::The source SHA already has a release; refusing to silently overwrite a test APK."
            exit 1
          fi
          printf '%s\n' \
            "APK de pruebas de Top Down RACE, compilada desde main SHA $GITHUB_SHA." \
            "Contiene la DEV identificada en index.html, incluida prueba A/B de física y controles nuevos." \
            "La aplicación com.craftracestudio.topdownrace.bridgetest se instala APARTE del juego de Google Play." \
            "Compilación Android release minificada y firmada con clave de PRUEBAS, no clave Play." \
            "Usa anuncios de prueba, no inventario real. No se ha generado ni publicado ningún AAB." \
            "Si otra APK bridgetest tenía una firma distinta, desinstala SOLO esa aplicación de pruebas." \
            "SHA-256: $(cat apk-sha256.txt)" > release-notes.txt
          gh release create "$TAG" "device-apk/$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Top Down RACE Android DEV · prueba de conducción" \
            --notes-file release-notes.txt
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME"
          echo "Direct APK: $url" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$APK_NAME"
          echo "Verified published release asset: $APK_NAME"
