name: Android cloud recovery installable test APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-cloud-reinstall-qa.yml'
      - 'src/game/social/**'
      - 'src/game/online/**'
      - 'src/game/ui/LobbyDomUi.js'
      - 'src/game/scenes/SettingsGraphicsQualityScene.js'
      - 'android/app/build.gradle'
      - 'android/app/src/cloudTest/**'
      - 'scripts/cloud-portability-smoke.mjs'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud_reinstall_apk:
    # Browser/PWA-only commits do not generate Android binaries.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[pwa-only]') }}
    name: Compile isolated player cloud-recovery APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE: ./
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK
        shell: bash
        run: |
          test -n "${ANDROID_HOME}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Verify portable cloud contract and generate Android game
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          node scripts/cloud-portability-smoke.mjs
          grep -Fq 'content="DEV 1.2.97"' index.html
          npm run build:android
          node scripts/verify-android-launcher.mjs
      - name: Compile standalone cloud reinstall APK
        working-directory: android
        run: ./gradlew :app:assembleCloudTestDebug --stacktrace
      - name: Verify no collision with public or rewarded QA packages
        shell: bash
        run: |
          set -euo pipefail
          src='android/app/build/outputs/apk/cloudTest/debug/app-cloudTest-debug.apk'
          test -s "$src"
          unzip -t "$src" | tail -1
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$src" | grep "package: name='com.craftracestudio.topdownrace.cloudtest'"
          mkdir -p sdk-download
          cp "$src" sdk-download/TDR-CLOUD-TEST-DEV-1.2.97.apk
          sha256sum sdk-download/TDR-CLOUD-TEST-DEV-1.2.97.apk
          ls -lh sdk-download/*.apk
      - name: Provide installable Redmi recovery test
        uses: actions/upload-artifact@v4
        with:
          name: TDR-CLOUD-TEST-DEV-1.2.97
          path: sdk-download/TDR-CLOUD-TEST-DEV-1.2.97.apk
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
