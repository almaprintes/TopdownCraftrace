<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TDR2" />

    <link rel="manifest" href="./manifest.webmanifest?v=20260810-ghp1" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <title>Top-Down Race</title>
    <script>
      (() => {
        const root = document.documentElement;
        let lastW = 0, lastH = 0, lastL = 0, lastT = 0, raf = 0;

        function measure() {
          raf = 0;
          const vv = window.visualViewport;
          const w = Math.max(1, Math.round(vv?.width || window.innerWidth || root.clientWidth || 1));
          const h = Math.max(1, Math.round(vv?.height || window.innerHeight || root.clientHeight || 1));
          const l = Math.max(0, Math.round(vv?.offsetLeft || 0));
          const t = Math.max(0, Math.round(vv?.offsetTop || 0));
          if (w === lastW && h === lastH && l === lastL && t === lastT) return;
          lastW = w; lastH = h; lastL = l; lastT = t;
          root.style.setProperty('--tdr-vv-width', `${w}px`);
          root.style.setProperty('--tdr-vv-height', `${h}px`);
          root.style.setProperty('--tdr-vv-left', `${l}px`);
          root.style.setProperty('--tdr-vv-top', `${t}px`);
          root.dataset.tdrVisualViewport = '1';
          try { window.dispatchEvent(new CustomEvent('tdr:viewportchange', { detail: { width:w, height:h, left:l, top:t } })); } catch {}
          try { window.dispatchEvent(new Event('resize')); } catch {}
        }

        function schedule() {
          if (raf) cancelAnimationFrame(raf);
          raf = requestAnimationFrame(measure);
        }

        measure();
        window.addEventListener('resize', schedule, { passive:true });
        window.addEventListener('orientationchange', schedule, { passive:true });
        window.addEventListener('pageshow', schedule, { passive:true });
        document.addEventListener('visibilitychange', () => { if (!document.hidden) schedule(); }, { passive:true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', schedule, { passive:true });
          window.visualViewport.addEventListener('scroll', schedule, { passive:true });
        }
      })();
    </script>
  </head>
  <body>
    <div id="rotateOverlay" aria-hidden="true">
      <div class="rot-shell">
        <img
          class="rot-image"
          src="./assets/ui/orientation_active.webp"
          alt=""
          aria-hidden="true"
        />
        <div class="rot-copy" role="status" aria-live="polite">
          <div class="rot-lang rot-es">
            <div class="rot-title">GIRA TU DISPOSITIVO</div>
            <div class="rot-sub">Top Down RACE se juega en horizontal.</div>
            <div class="rot-beta">
              <div class="rot-beta-title">⚠ VERSIÓN BETA</div>
              <div class="rot-beta-text">TODO EL PROGRESO DE LA BETA SE REINICIARÁ CON EL LANZAMIENTO DEL JUEGO.</div>
            </div>
          </div>
          <div class="rot-lang rot-en">
            <div class="rot-title">ROTATE YOUR DEVICE</div>
            <div class="rot-sub">Top Down RACE is played in landscape.</div>
            <div class="rot-beta">
              <div class="rot-beta-title">⚠ BETA VERSION</div>
              <div class="rot-beta-text">ALL BETA PROGRESS WILL BE RESET WHEN THE GAME LAUNCHES.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>

<!-- CAR FACTORY HTML MODAL  -->

<div id="carFactoryModal" class="cf-modal hidden">
  <div class="cf-card">
    <h3 id="cf-title">Editar</h3>

    <input id="cf-input" type="text" />

    <div class="cf-actions">
      <button id="cf-cancel">Cancelar</button>
      <button id="cf-save">Guardar</button>
    </div>
  </div>
</div>

<style>
.cf-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  backdrop-filter: blur(4px);
}

.cf-card {
  width: 320px;
  background: #0b1020;
  border: 1px solid rgba(44,246,255,0.4);
  border-radius: 14px;
  padding: 20px;

  font-family: system-ui;
}

.cf-card h3 {
  margin: 0 0 12px 0;
  font-size: 16px;
  color: #2cf6ff;
}

.cf-card input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #111a33;
  color: white;
  margin-bottom: 14px;
  font-size: 14px;
}

.cf-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.cf-actions button {
  padding: 8px 14px;

  font-weight: 600;
}

#cf-save {
  background: #2cf6ff;

}
