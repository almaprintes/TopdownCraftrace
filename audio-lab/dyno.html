<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Veloce Dyno Lab</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#071017;color:#eef6ff;margin:0;padding:18px}.card{background:#0c1822;border:1px solid #36506a;border-radius:14px;padding:14px;margin:12px 0}button{font:inherit;font-weight:800;padding:12px 14px;margin:4px;border-radius:10px;border:1px solid #537899;background:#162b3b;color:#fff}input[type=range]{width:100%;height:46px}.row{display:grid;grid-template-columns:85px 1fr 60px;gap:8px;align-items:center}.ok{color:#96f7bb}.bad{color:#ff9c9c}#status{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px}</style></head><body><h1>Veloce Dyno Lab · WebAudio</h1><p>Prueba directa por fetch + decodeAudioData. No usa el reproductor HTML de Safari.</p><div class="card"><button id="load">CARGAR Y DECODIFICAR</button><button id="play">REPRODUCIR</button><button id="pause">PAUSA</button><div class="row"><span>Posición</span><input id="pos" type="range" min="0" max="1000" value="0"><b id="posv">0.0s</b></div><div class="row"><span>Límite</span><input id="limit" type="range" min="240" max="330" value="310"><b id="limitv">31.0s</b></div><div class="row"><span>Velocidad</span><input id="rate" type="range" min="65" max="135" value="100"><b id="ratev">1.00×</b></div><button id="sweep">SUBIDA 0→LÍMITE</button></div><div class="card"><div id="status">Esperando toque…</div></div><script>const URL='/TopdownCraftrace/audio-lab/assets/audio/cars/veloce_flash/engine/freesound_community-import-car-revs-on-chassis-dyno-with-turbo-66272.mp3';let ctx=null,buf=null,src=null,gain=null,startAt=0,startedCtx=0,playing=false,timer=null;const q=s=>document.querySelector(s),status=q('#status'),pos=q('#pos'),posv=q('#posv'),limit=q('#limit'),limitv=q('#limitv'),rate=q('#rate'),ratev=q('#ratev');function log(s,bad=false){status.innerHTML='<span class="'+(bad?'bad':'ok')+'">'+s+'</span>'}function end(){return Number(limit.value)/10}function current(){if(!playing||!ctx)return startAt;return startAt+(ctx.currentTime-startedCtx)*Number(rate.value)/100}function sync(){let t=Math.min(current(),end());pos.value=Math.round(t/end()*1000);posv.textContent=t.toFixed(1)+'s';if(playing&&t>=end()){stopSource();startAt=Math.max(.15,end()-.12);log('PARADA DE SEGURIDAD a '+end().toFixed(1)+' s')} }function stopSource(){if(src){try{src.stop()}catch{}src=null}playing=false;clearInterval(timer);timer=null}async function ensureCtx(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();gain=ctx.createGain();gain.gain.value=.75;gain.connect(ctx.destination)}if(ctx.state!=='running')await ctx.resume()}async function load(){await ensureCtx();log('Descargando MP3…');try{const r=await fetch(URL,{cache:'no-store'});log('HTTP '+r.status+' · '+(r.headers.get('content-type')||'sin MIME'));if(!r.ok)throw new Error('HTTP '+r.status);const ab=await r.arrayBuffer();log('Descargado '+ab.byteLength+' bytes · decodificando…');buf=await ctx.decodeAudioData(ab.slice(0));startAt=.15;sync();log('OK · duración '+buf.duration.toFixed(2)+' s · '+ab.byteLength+' bytes');return true}catch(e){log('ERROR: '+e.name+' · '+e.message,true);return false}}function playFrom(t){stopSource();src=ctx.createBufferSource();src.buffer=buf;src.playbackRate.value=Number(rate.value)/100;src.connect(gain);startAt=Math.max(.15,Math.min(t,end()-.05));startedCtx=ctx.currentTime;src.start(0,startAt);playing=true;timer=setInterval(sync,50)}q('#load').onclick=load;q('#play').onclick=async()=>{if(!buf&&!await load())return;await ensureCtx();playFrom(startAt)};q('#pause').onclick=()=>{startAt=current();stopSource();sync();log('Pausa en '+startAt.toFixed(2)+' s')};pos.oninput=async e=>{if(!buf&&!await load())return;startAt=Number(e.target.value)/1000*end();if(playing)playFrom(startAt);sync()};limit.oninput=e=>{limitv.textContent=(Number(e.target.value)/10).toFixed(1)+'s';if(startAt>end())startAt=end()-.12;sync()};rate.oninput=e=>{ratev.textContent=(Number(e.target.value)/100).toFixed(2)+'×';if(playing){startAt=current();playFrom(startAt)}};q('#sweep').onclick=async()=>{if(!buf&&!await load())return;await ensureCtx();playFrom(.15)};</script></body></html>
